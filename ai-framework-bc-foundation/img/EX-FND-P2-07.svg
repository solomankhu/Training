<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>บันทึกรอบงาน R-SCP-11 เพิ่ม field ผู้ตรวจรับในใบสั่งผลิตของโครงการ SCP-INS ที่ระบุระดับงาน แผน และร่างในพื้นที่ร่าง</title>

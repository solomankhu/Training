<text x="28" y="29.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">บันทึกรอบงาน R-SCP-11 เพิ่ม field ผู้ตรวจรับในใบสั่งผลิต SCP-INS</text>

<!DOCTYPE html>
<html lang="th">
<head>

<title>SSM · แบบทดสอบหลังอบรม</title>

<!-- ฟอนต์: โดเมนเดียวคู่เดียว (googleapis + gstatic) · โหลดแบบไม่บล็อกการวาดหน้าจอ
     สัญญาณอ่อนจะเห็นฟอนต์สำรองก่อน แล้วสลับเป็น Sarabun เมื่อโหลดเสร็จ (display=swap) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&amp;display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --ground:#EEF2EC; --surface:#FFFFFF; --surface-2:#F7F9F4; --surface-3:#EDF1EA;
  --ink:#16221C; --muted:#5E6D64;
  --line:#DCE3D9; --line-2:#C3CEBF; --line-strong:#7D8C83;
  --accent:#1a6b3a; --accent-ink:#FFFFFF; --accent-soft:#E3F0E7;
  --earth:#5c2b0a; --gold:#C9A227;
  --amber:#8A5A0F; --amber-soft:#FBF1DC;
  --bad:#A33A2C; --bad-soft:#F9E5E2;
  --shadow:0 1px 2px rgba(22,34,28,.06), 0 8px 24px rgba(22,34,28,.06);
  --font:"Sarabun","Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0E1410; --surface:#19211B; --surface-2:#202A22; --surface-3:#26312A;
    --ink:#E7EDE6; --muted:#9AA79F;
    --line:#2C382F; --line-2:#3D4A40; --line-strong:#6F7D74;
    --accent:#63AC80; --accent-ink:#0E1410; --accent-soft:#1D3227;
    --earth:#D9A77A;
    --amber:#E0A858; --amber-soft:#33270F;
    --bad:#E07866; --bad-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  height:100%; margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; overflow-wrap:break-word; -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
img{max-width:100%}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

#shell{position:relative;height:100%;height:100dvh;max-width:560px;margin:0 auto;background:var(--surface);
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
.strip{flex:0 0 auto;background:var(--amber-soft);color:var(--amber);font-size:13px;font-weight:600;
  line-height:1.5;padding:6px 16px;text-align:center;border-bottom:1px solid var(--line)}

/* ---- หัวหน้าจอ: โลโก้ + ชื่อ + บทบาท ---- */
.brand{flex:0 0 auto;display:flex;align-items:center;gap:10px;min-height:56px;
  padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));
  background:var(--surface);border-bottom:1px solid var(--line)}
.logo{flex:0 0 auto;display:block;width:30px;height:36px;color:var(--earth)}
.brand-t{margin:0;min-width:0;font-size:16px;font-weight:700;line-height:1.35;color:var(--ink)}
.brand-t span{color:var(--muted);font-weight:600}
.pill{margin-left:auto;flex:0 0 auto;max-width:48%;display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:600;line-height:1.35;padding:5px 11px 5px 9px;border-radius:999px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink)}
.pill::before{content:"";flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--gold)}

/* ---- แถบความคืบหน้าแบ่ง 5 หมวด ---- */
.prog{flex:0 0 auto;padding:10px 16px 9px;display:flex;flex-direction:column;gap:8px;
  background:var(--surface);border-bottom:1px solid var(--line)}
.prog-meta{display:flex;justify-content:space-between;align-items:center;gap:12px}
.prog-count{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{min-width:0;font-size:13px;font-weight:600;line-height:1.4;padding:3px 10px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);text-align:right}
.segs{display:flex;gap:6px}
.seg{flex:1 1 0;min-width:22px;display:flex;flex-direction:column;align-items:center;gap:3px}
.seg-bar{display:block;width:100%;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.seg-bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s cubic-bezier(.4,0,.2,1)}
.seg-lab{display:flex;align-items:center;justify-content:center;height:15px;font-size:13px;line-height:1;font-weight:600;color:var(--muted)}
.seg-lab svg{display:block}
.seg.is-cur .seg-lab{color:var(--accent);font-weight:700}
.seg.is-gap .seg-lab{color:var(--amber)}

.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:20px 16px 32px}
.foot{flex:0 0 auto;display:flex;gap:8px;align-items:center;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}

h1{font-size:24px;line-height:1.45;margin:0;font-weight:700;text-wrap:balance}
h2{font-size:18px;line-height:1.5;margin:0;font-weight:600}
.eyebrow{font-size:14px;font-weight:600;color:var(--muted);margin:0;line-height:1.6}
.lede{color:var(--muted);margin:0;font-size:16px;line-height:1.65}
.tiny{font-size:13px;color:var(--muted);margin:0;line-height:1.6}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.center{text-align:center;align-items:center}
hr.rule{border:0;border-top:1px solid var(--line);margin:2px 0;width:100%}

/* ---- ภาพประกอบบทบาท (สีเดียว ตามสี accent) ---- */
.hero{display:flex;justify-content:center;padding:2px 0 0}
.art{display:block;width:176px;height:auto;color:var(--accent)}
.hero .art{width:196px}

/* ---- ลงทะเบียน ---- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:14px;font-weight:600;color:var(--muted)}
.field input,.field select{font-size:16px;min-height:48px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);width:100%}
.field input::placeholder{color:var(--muted)}
.role-fixed{display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--accent);background:var(--accent-soft)}
.role-fixed b{font-size:16px;font-weight:600;color:var(--accent)}
.role-fixed .chip{margin-left:auto}
.facts{display:flex;gap:8px;flex-wrap:wrap}
.fact{flex:1 1 30%;min-width:96px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:18px;font-weight:700;line-height:1.4}
.fact span{font-size:13px;color:var(--muted)}
.prep{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.prep-row{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--muted);line-height:1.5}
.prep-bar{display:block;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.prep-bar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.spin{flex:0 0 auto;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line-2);border-top-color:var(--accent);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- คำถาม ---- */
.stem{font-size:18px;line-height:1.7;font-weight:600;margin:0}
.hint{font-size:14px;color:var(--muted);margin:0;line-height:1.6}
.who{display:flex;align-items:center;gap:10px}
.ava{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  background:hsl(var(--h,150),45%,32%);color:#FFFFFF;font-size:16px;font-weight:700;line-height:1}
.who-t{font-size:14px;line-height:1.5;color:var(--muted)}
.who-t b{color:var(--ink);font-weight:600}
.case{position:sticky;top:0;z-index:2;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
@media (max-height:640px){.case{position:static}}
.case-title{margin:0;font-size:15px;font-weight:700;line-height:1.5;color:var(--accent)}
.case-text{margin:0;font-size:16px;line-height:1.65;white-space:pre-line}

/* ภาพในโจทย์ -- กรอบจองสัดส่วนไว้ก่อน ภาพโหลดเสร็จแล้วหน้าจอไม่กระโดด */
.qfig{margin:0}
.fig-btn{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  background:var(--surface-3);cursor:zoom-in;text-align:left}
.pic{position:relative;display:block;width:100%;background:var(--surface-3);overflow:hidden}
.pic img{display:block;width:100%;height:auto}
/* ภาพหน้าจอมือถือสูงมาก (400x856) -- จำกัดความสูงในโจทย์ไว้ ~40% ของจอ ให้โจทย์กับตัวเลือกยังอยู่ในสายตา
   กว้างตามสัดส่วนของภาพ (--ar = w/h) จึงไม่ถูกครอบตัด · แตะเพื่อดูเต็มจอได้เหมือนเดิม */
.qfig .pic{width:min(100%, calc(40vh * var(--ar, 1.3333)));margin:0 auto}
.pic.err img{visibility:hidden}
.pic-err{display:none;position:absolute;top:0;right:0;bottom:0;left:0;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:12px;text-align:center;font-size:14px;font-weight:600;line-height:1.5;color:var(--muted);background:var(--surface-3)}
.pic.err .pic-err,.pic.retrying .pic-err{display:flex}
.pic.retrying .pic-err svg{animation:spin 1s linear infinite}
.zoom-badge{position:absolute;right:8px;bottom:8px;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;
  border-radius:999px;background:rgba(14,20,16,.8);color:#FFFFFF;font-size:13px;font-weight:600;line-height:1.35;pointer-events:none}
.pic.err .zoom-badge{display:none}

/* ตัวเลือกแบบข้อความ */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;min-height:56px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--line-2);background:var(--surface-2);text-align:left}
.opt[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.box{flex:0 0 auto;width:24px;height:24px;margin-top:2px;border-radius:7px;border:2px solid var(--line-strong);
  background:var(--surface);display:grid;place-items:center}
.box.round{border-radius:50%}
.opt[aria-checked="true"] .box{border-color:var(--accent);background:var(--accent)}
.box svg{opacity:0;width:14px;height:14px}
.opt[aria-checked="true"] .box svg{opacity:1}
.opt-text{flex:1;min-width:0;font-size:16px;line-height:1.6}
.opt-ico{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px}

/* ตัวเลือกแบบภาพ: การ์ด 2 คอลัมน์ · ปุ่มขยายแยกจากการเลือก */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{position:relative;min-width:0}
.card-sel{position:relative;display:flex;flex-direction:column;gap:8px;width:100%;height:100%;padding:8px;
  border-radius:14px;border:1px solid var(--line-2);background:var(--surface-2);text-align:left}
.card-sel[aria-checked="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.card-head{display:flex;align-items:center;gap:8px;min-height:44px;padding-right:48px}
.card-sel.noimg .card-head{padding-right:0}
.card-letter{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  font-size:24px;font-weight:700;line-height:1;background:var(--surface);border:1px solid var(--line-2);color:var(--ink)}
.card-sel[aria-checked="true"] .card-letter{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card-tick{margin-left:auto;flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--accent);opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.card-tick svg{width:16px;height:16px}
.card-sel[aria-checked="true"] .card-tick{opacity:1;transform:none}
.card .pic{border-radius:10px;border:1px solid var(--line)}
.card-text{font-size:16px;line-height:1.6;padding:0 2px 2px}
.card-zoom{position:absolute;top:8px;right:8px;z-index:1;width:44px;height:44px;padding:0;border-radius:12px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);display:grid;place-items:center}

/* จัดลำดับ -- ปุ่มจับด้านขวาสำหรับลาก + ปุ่ม ↑ ↓ ที่ต้องมีเสมอ (D13) */
.ord{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;position:relative}
.ord li{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:12px;
  border:1px solid var(--line-2);background:var(--surface-2);position:relative}
.ord li.dragging{z-index:5;border-color:var(--accent);background:var(--surface);
  box-shadow:0 8px 22px rgba(0,0,0,.18);pointer-events:none;user-select:none}
.rank{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.ord-text{flex:1;min-width:0;font-size:16px;line-height:1.6}
.nudge{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.nudge button{width:48px;height:48px;padding:0;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);
  display:grid;place-items:center}
.nudge button:disabled{opacity:.35;cursor:not-allowed}
.grip{flex:0 0 auto;align-self:stretch;width:48px;min-height:48px;border-radius:10px;border:1px dashed var(--line-strong);
  background:var(--surface);display:grid;place-items:center;padding:0;cursor:grab;touch-action:none;
  -webkit-user-select:none;user-select:none}
.grip:active{cursor:grabbing;background:var(--accent-soft);border-color:var(--accent)}

/* ---- ปุ่ม ---- */
.btn{flex:1;min-height:48px;padding:11px 16px;border-radius:12px;border:1px solid transparent;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;line-height:1.4}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{flex:0 0 auto;background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.next{flex:0 0 auto;min-width:118px}
.saved{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;color:var(--muted);line-height:1.4}

/* ---- เปิดหมวด ---- */
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-top:8px;
  padding:28px 20px 28px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line)}
.intro-art{position:relative;margin-bottom:4px}
.intro-num{position:absolute;right:-8px;top:-8px;width:44px;height:44px;border-radius:50%;background:var(--gold);
  color:#16221C;display:grid;place-items:center;font-size:20px;font-weight:700;line-height:1;box-shadow:0 0 0 4px var(--surface-2)}
.intro-n{margin:0;font-size:15px;font-weight:600;line-height:1.5;color:var(--accent);background:var(--accent-soft);
  padding:3px 14px;border-radius:999px}

/* ---- ตรวจก่อนส่ง ---- */
.grp{display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:600;line-height:1.5}
.grp-h span{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.cell{width:100%;min-height:52px;aspect-ratio:1;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;line-height:1.3}
.cell b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.cell span{font-size:13px}
.cell.done{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cell.todo{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.tally{display:flex;gap:8px}
.tally div{flex:1;border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.tally .ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tally .no{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.tally b{display:block;font-size:20px;font-weight:700;line-height:1.4}
.tally span{font-size:13px}
.warn{color:var(--amber);font-weight:600}

/* ---- ส่งแล้ว ---- */
.finish-top{position:relative;display:flex;justify-content:center;padding:22px 0 8px}
.stamps{position:relative;z-index:1;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stamp{width:54px;height:54px;border-radius:50%;border:3px solid var(--gold);background:var(--accent-soft);color:var(--accent);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1;
  animation:stampIn .45s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i,0) * 90ms)}
.stamp b{font-size:18px;font-weight:700}
.stamp svg{width:14px;height:14px}
@keyframes stampIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.burst{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-6px;top:-15px;width:12px;height:30px;border-radius:0 100% 0 100%;background:var(--accent);
  opacity:0;animation:leaf 1.3s cubic-bezier(.2,.7,.3,1) var(--t,0ms) 1 forwards}
.burst i.g{background:var(--gold)}
@keyframes leaf{
  0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.3)}
  15%{opacity:1}
  100%{opacity:0;transform:rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(1)}
}
.receipt{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.kv span{font-size:14px;color:var(--muted)}
.kv b{font-size:15px;font-weight:600;text-align:right}
.kv b.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.errbox{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:13px 14px}
.errbox .eyebrow{color:var(--bad)}
.errbox p{margin:6px 0 0;font-size:15px;line-height:1.6;color:var(--ink)}
.errbox .btn{margin-top:10px;width:100%}

/* ---- toast หลักไมล์ -- ไม่บอกผล ไม่มีคะแนน ---- */
.toast{position:absolute;left:16px;right:16px;bottom:88px;z-index:20;display:flex;align-items:center;gap:10px;
  padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--surface);font-size:15px;font-weight:600;line-height:1.5;
  box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .25s ease,transform .25s ease}
.toast.show{opacity:1;transform:none}
.toast.off{transition:none}
.t-ico{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--gold);display:grid;place-items:center}

/* ---- ภาพขยายเต็มจอ ---- */
.zoom{position:fixed;top:0;left:0;width:100%;height:100%;max-width:none;max-height:none;margin:0;padding:0;border:0;
  background:#0B0F0C;color:#FFFFFF;overflow:hidden}
.zoom::backdrop{background:#0B0F0C}
.z-stage{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;overflow:auto;-webkit-overflow-scrolling:touch;
  padding:64px 8px 88px;touch-action:pan-x pan-y pinch-zoom}
.z-stage img{display:block;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;background:#FFFFFF;border-radius:4px}
.z-stage.actual img{max-width:none;max-height:none}
.z-close{position:absolute;z-index:2;top:calc(8px + env(safe-area-inset-top,0px));right:8px;width:48px;height:48px;padding:0;
  border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#FFFFFF;display:grid;place-items:center}
.z-cap{position:absolute;left:0;right:0;bottom:0;margin:0;padding:18px 16px calc(12px + env(safe-area-inset-bottom,0px));
  font-size:15px;line-height:1.55;color:#E7EDE6;background:linear-gradient(rgba(11,15,12,0),rgba(11,15,12,.88) 34%)}
.z-cap small{display:block;font-size:13px;color:#B9C4BD}
.z-err{position:absolute;top:50%;left:16px;right:16px;transform:translateY(-50%);z-index:1;display:flex;flex-direction:column;
  align-items:center;gap:8px;padding:18px;border-radius:14px;background:#26312A;color:#E7EDE6;font-size:15px;font-weight:600;
  border:0;text-align:center}

.strip{display:flex;flex-direction:column;align-items:center;gap:6px}
.strip-btn{min-height:48px;padding:8px 16px;border-radius:10px;border:1px solid var(--amber);background:var(--surface);
  color:var(--ink);font-weight:600;font-size:15px;line-height:1.4}
.stem:focus{outline:none}
h1[tabindex="-1"]:focus{outline:none}   /* หัวข้อรับโฟกัสจากโค้ดเพื่อ screen reader -- ไม่ใช่ปุ่ม ไม่ต้องมีวงโฟกัส */
/* ปุ่มหลักที่ยังกดไปต่อไม่ได้ -- aria-disabled จึงยังโฟกัสได้ · กรอบ --line-strong ≥3:1 · ตัวอักษร --muted ≥4.5:1 */
.btn.gated{background:var(--surface);border-color:var(--line-strong);color:var(--muted)}
.gate{flex:0 0 auto;margin:0;max-height:0;overflow:hidden;padding:0 16px;background:var(--amber-soft);color:var(--amber);
  font-size:14px;font-weight:600;line-height:1.5}
.gate.show{max-height:200px;padding:10px 16px;border-top:1px solid var(--line)}
.saved.bad{color:var(--amber);font-weight:600}
.missbox{background:var(--amber-soft);border:1px solid var(--amber);border-radius:12px;padding:12px 14px}
.missbox b{display:block;font-size:17px;line-height:1.5;color:var(--amber)}
.missbox p{margin:4px 0 0;font-size:15px;line-height:1.6;color:var(--ink)}
.misslist{display:flex;flex-direction:column;gap:8px}
.miss{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:10px 14px;border-radius:12px;
  border:1px solid var(--amber);background:var(--surface);color:var(--ink);text-align:left;font-size:15px;line-height:1.5}
.miss::after{content:"\203A";margin-left:auto;font-size:24px;line-height:1;color:var(--amber)}
.resume{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--accent);background:var(--accent-soft)}
.resume-t{margin:0;font-size:17px;font-weight:700;line-height:1.5;color:var(--accent)}
.resume-m{margin:0;font-size:15px;line-height:1.6;color:var(--ink)}
.resume-w{margin:0;font-size:14px;font-weight:600;line-height:1.6;color:var(--amber)}
.resume-row{display:flex;gap:8px;margin-top:6px}
.send{align-items:center;text-align:center;padding-top:24px}
.send-ico{width:56px;height:56px;display:grid;place-items:center;color:var(--accent)}
.send-ico.wait{color:var(--amber)}
.send-ico.bad{color:var(--bad)}
.spin.big{width:40px;height:40px;border-width:4px}
.send-card{align-self:stretch;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface-2);text-align:left}
.send-card p{margin:0;display:flex;gap:8px;align-items:flex-start;font-size:15px;line-height:1.6}
.send-card svg{flex:0 0 auto;margin-top:6px}
.escalate{align-self:stretch;padding:12px 14px;border-radius:12px;background:var(--amber-soft);border:1px solid var(--amber);
  color:var(--ink);font-size:15px;line-height:1.6;text-align:left}
.escalate .code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;white-space:nowrap}
.ask{border:0;border-radius:16px;padding:20px;width:calc(100% - 32px);max-width:380px;background:var(--surface);color:var(--ink);
  box-shadow:0 20px 50px rgba(0,0,0,.35)}
.ask::backdrop{background:rgba(0,0,0,.5)}
.ask-t{margin:0 0 16px;font-size:17px;font-weight:600;line-height:1.6}
.ask-row{display:flex;gap:8px}
.ask-row .btn{flex:1}
.still .stamp{animation:none}

@media (prefers-reduced-motion: reduce){
  .burst{display:none}
  .stamp{animation:none}
  .seg-bar i,.prep-bar i,.toast,.card-tick{transition:none}
  .spin{animation:none}
}

/* ==== ความพอดีจอ (เจ้าของงาน 2026-09-25) ============================================
   ปุ่ม "ถัดไป" อยู่แถบล่างสุดเสมอ เนื้อหาเลื่อนอยู่ด้านบน · บีบระยะให้ข้อส่วนใหญ่พอดีจอโดยไม่ต้องเลื่อน
   ระยะบรรทัดภาษาไทย: ข้อความหลายบรรทัด 1.45-1.55 ไม่ต่ำกว่า 1.4 · ตัวอักษรไม่เล็กกว่า 13px (ด่าน e2e)
   ปุ่มทั่วไปสูง 48px · ปุ่มจัดลำดับ 40px แนวนอน ตามที่เจ้าของงานเลือก */
html,body{overscroll-behavior:none}
.brand{min-height:48px;gap:8px;padding:6px 16px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.logo{width:24px;height:29px}
.brand-t{font-size:15px;line-height:1.3}
.pill{padding:3px 10px 3px 8px;line-height:1.3}
.prog{padding:8px 16px 6px;gap:6px}
.prog-count{font-size:13px;line-height:1.3}
.chip{padding:2px 9px;line-height:1.35}
.segs{gap:4px}
.seg{min-width:0;gap:2px}
.seg-bar{height:6px}
.seg-lab{height:14px}
.pad{padding:12px 16px 16px}
.foot{padding:8px 16px 10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.stack{gap:12px}
.stem{font-size:17px;line-height:1.55}
.hint{line-height:1.45}
.who{gap:8px}
.ava{width:32px;height:32px;font-size:14px}
.who-t{line-height:1.4}
.case{padding:10px 12px;gap:4px;border-radius:12px}
.case-title{line-height:1.4}
.case-text{font-size:15px;line-height:1.55}
.qfig .pic{width:min(100%, calc(30vh * var(--ar, 1.3333)));width:min(100%, calc(30svh * var(--ar, 1.3333)))}
.zoom-badge{white-space:nowrap}
.opts{gap:6px}
.opt{min-height:48px;padding:10px 12px;gap:10px}
.box{margin-top:0}
.opt-text{line-height:1.5}
.btn{padding:10px 16px}

/* จัดลำดับ: ↑ ↓ และที่จับลากเรียงแนวนอน ขนาด 40px มีสีแยกชัด (ขึ้น = เขียว · ลง = ส้ม · ลาก = เทา) */
.ord{gap:6px}
.ord li{padding:6px 6px 6px 10px;gap:6px}
.rank{width:26px;height:26px;font-size:14px}
.ord-text{font-size:15px;line-height:1.5}
.nudge{flex-direction:row;gap:4px;align-items:center}
.nudge button{width:40px;height:40px;border-radius:10px}
.nudge [data-mv="up"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nudge [data-mv="down"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.nudge button:disabled{opacity:.3}
.grip{align-self:center;width:40px;height:40px;min-height:40px;border:1px solid var(--line-strong);
  background:var(--surface-3);color:var(--muted)}

/* จอเตี้ย (ส่วนใหญ่คือมือถือจอเล็ก หรือมีแถบเครื่องมือของเบราว์เซอร์กินพื้นที่) -- บีบเพิ่มอัตโนมัติ */
@media (max-height:720px){
  .brand{min-height:44px;padding-top:calc(4px + env(safe-area-inset-top,0px));padding-bottom:4px}
  .prog{padding:6px 16px 4px;gap:4px}
  .pad{padding:10px 16px 12px}
  .stack{gap:10px}
  .stem{font-size:16px;line-height:1.5}
  .hint{font-size:13px;line-height:1.4}
  .ava{width:28px;height:28px;font-size:13px}
  .who-t{font-size:13px}
  .case{position:static;padding:8px 10px}
  .case-text{font-size:15px;line-height:1.5}
  .opt{padding:8px 12px}
  .box{width:22px;height:22px}
  .opt-text{font-size:15px;line-height:1.45}
  .ord li{padding:4px 4px 4px 8px}
  .ord-text{font-size:15px;line-height:1.45}
  .qfig .pic{width:min(100%, calc(26vh * var(--ar, 1.3333)));width:min(100%, calc(26svh * var(--ar, 1.3333)))}
  .foot{padding-top:6px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
}

/* ?diag=1 -- วัดค่าจอของเครื่องจริง ไว้ยืนยันว่าแถบล่างถูกบังหรือไม่ ผู้สอบปกติไม่เห็น */
.diag{position:fixed;left:8px;right:8px;top:8px;z-index:99;padding:8px 10px;border-radius:10px;
  background:rgba(0,0,0,.82);color:#fff;font:13px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;pointer-events:none}
.diag-bar{position:fixed;left:0;right:0;bottom:0;height:2px;background:#e11d48;z-index:99;pointer-events:none}
.diag-probe{position:fixed;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
  env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>
</head>

function readJSON(key){

   ร่างจากรุ่นอื่น (รวมร่างจากหน้าเก่าที่ไม่มี bankVersion) ทำต่อไม่ได้ -- บอกผู้สอบแล้วให้เริ่มใหม่ (D7) */
function draftFromOtherBank(d){
  return !!window.BANK_VERSION && d.bankVersion !== window.BANK_VERSION;
}
/* เครื่องที่ใช้ร่วมกัน: ร่างของบทบาทอื่นห้ามทับบทบาทที่มากับ QR (D5) */
function draftOtherRole(d){ return !!QR.role && !!d.role && d.role !== QR.role; }
function adopt(d){ for (var k in d) state[k] = d[k]; }
function load(){
  var d = readDraft();
  if (!resumable(d) || draftOtherRole(d) || draftFromOtherBank(d)) return false;
  adopt(d);
  normaliseDraft();
  return true;
}
function hasDraft(){ return resumable(readDraft()); }
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }
/* ร่างจากหน้าเวอร์ชันก่อนไม่มีฟิลด์ใหม่ -- เติมให้ครบโดยไม่แตะคำตอบ */
function normaliseDraft(){
  var items = ITEMS();
  if (state.idx >= items.length) state.idx = Math.max(0, items.length - 1);
  if (!state.introSeen || typeof state.introSeen !== 'object') {
    state.introSeen = {};
    var cur = items[state.idx];
    if (cur) for (var k = 1; k <= cur.part; k++) state.introSeen[k] = true;
  }
  if (!state.answers || typeof state.answers !== 'object') state.answers = {};
  if (!state.order || typeof state.order !== 'object') state.order = {};
  if (state.screen === 'sending' || state.screen === 'failed' || state.screen === 'confirm') state.screen = 'review';
  if (!state.milestones || typeof state.milestones !== 'object') {
    state.milestones = {};
    checkMilestones(true);
  }
}

function orderItems(it){ return it.type==='ordering' ? it.items : null; }
/* ลำดับตั้งต้น = ลำดับใน items.js ตรง ๆ -- exam_build สลับไว้แล้ว และเลือกให้ลำดับที่ยังไม่ขยับได้คะแนนไม่เกิน 1/3
   (เจ้าของงาน 2026-09-25: กด "ถัดไป" = ยืนยันลำดับที่เห็น ไม่มีปุ่มยืนยันแยก) */
function startOrder(it){
  var n = orderItems(it).length, seq = [];
  for(var i=0;i<n;i++) seq.push(i);
  return seq;
}
function initOrder(it){
  var n = orderItems(it).length, cur = state.order[it.id];
  if(!cur || cur.length !== n) state.order[it.id] = startOrder(it);
  return state.order[it.id];
}
function isPerm(a, n){
  if (!Array.isArray(a) || a.length !== n) return false;
  var seen = {};
  for (var i = 0; i < n; i++) {
    var x = a[i];
    if (x !== (x|0) || x < 0 || x >= n || seen[x]) return false;
    seen[x] = 1;
  }
  return true;
}
/* ฟังก์ชันเดียวที่ตัดสินว่า "ตอบแล้ว" -- ปุ่มถัดไป · หน้าตรวจ · missing() · ด่านก่อนส่ง · แถบคืบหน้า · หลักไมล์ ใช้ตัวนี้ทั้งหมด */
function isAnswered(it, st){
  st = st || state;
  if (!it) return false;
  // ข้อเรียงลำดับ: ลำดับที่แสดงอยู่คือคำตอบตั้งแต่เปิดข้อ -- ขาดเฉพาะข้อที่ยังไม่เคยเปิด
  if (it.type === 'ordering') return isPerm(st.order && st.order[it.id], (it.items || []).length);
  var a = st.answers && st.answers[it.id], n = (it.options || []).length;
  if (!Array.isArray(a)) return false;
  function inRange(x){ return x === (x|0) && x >= 0 && x < n; }
  if (it.type === 'multiple') {
    var seen = {}, c = 0;
    a.forEach(function(x){ if (inRange(x) && !seen[x]) { seen[x] = 1; c++; } });
    return c >= 1;
  }
  return a.length === 1 && inRange(a[0]);
}
function reasonOf(it){
  return it.type === 'ordering' ? 'ยังไม่ได้เปิดข้อนี้เพื่อจัดลำดับ'
       : it.type === 'multiple' ? 'ยังไม่ได้เลือกคำตอบ (เลือกได้มากกว่า 1 ข้อ)'
       : 'ยังไม่ได้เลือกคำตอบ';
}
function missing(){
  var out = [];
  ITEMS().forEach(function(it, i){ if (!isAnswered(it)) out.push(i); });
  return out;
}
function countAnswered(d){
  var items = (d && d.role && BANKDATA()[d.role]) || [];
  return items.filter(function(it){ return isAnswered(it, d); }).length;
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* สรุปหมวดของบทบาทปัจจุบัน -- ขนาดแถบแต่ละหมวดเป็นสัดส่วนกับจำนวนข้อจริง */
function partStats(){
  var items = ITEMS(), map = {}, list = [];
  items.forEach(function(it, i){
    var p = map[it.part];
    if(!p){ p = map[it.part] = { k: it.part, idx: [], done: 0 }; list.push(p); }
    p.idx.push(i);
    if(isAnswered(it)) p.done++;
  });
  list.sort(function(a, b){ return a.k - b.k; });
  return list;
}

/* ============================ ตัวละครและภาพ ============================ */
var KIN = ['น้อง','พี่','น้า','ลุง','ป้า','ยาย','คุณ','อา','ตา'];
/* อักษรย่อ: ตัดคำเรียกญาติ แล้วเอาพยัญชนะตัวแรก (พร้อมสระหน้า ห/อ นำ และวรรณยุกต์ที่เกาะอยู่) */
function initial(name){
  var s = String(name || '').trim(), ch, out = '', j = 0;
  for (var i = 0; i < KIN.length; i++) {
    if (s.indexOf(KIN[i]) === 0 && s.length > KIN[i].length) { s = s.slice(KIN[i].length); break; }
  }
  ch = Array.from ? Array.from(s) : s.split('');
  if (!ch.length) return '?';
  if (/[เแโใไ]/.test(ch[0]) && ch.length > 1) { out = ch[0]; j = 1; }
  out += ch[j]; j++;
  if (/[หอ]/.test(ch[j - 1]) && /[งญนมยรลว]/.test(ch[j] || '')) { out += ch[j]; j++; }
  while (j < ch.length && /[ัิ-ฺ็-๎]/.test(ch[j])) { out += ch[j]; j++; }
  return out;
}
function hue(key){
  var h = 0;
  for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return h % 360;
}
function whoRow(it){
  var c = castOf(it.chr);
  if (!c) return '';
  return '<div class="who"><span class="ava" aria-hidden="true" style="--h:' + hue(String(it.chr)) + '">' + esc(initial(c.name)) + '</span>'
    + '<span class="who-t">' + (c.role ? '<b>' + esc(c.role) + '</b> (' + esc(c.name) + ')' : '<b>' + esc(c.name) + '</b>') + '</span></div>';
}

/* รับเฉพาะ path สัมพัทธ์ภายในเว็บนี้ -- img/<hash>.webp ตามสัญญาของตัวสร้าง */
function safeImg(m){
  if (!m || typeof m.src !== 'string') return null;
  var src = m.src;
  if (!/^[A-Za-z0-9_][A-Za-z0-9_.\/-]*\.(webp|png|jpe?g)$/.test(src) || src.indexOf('..') >= 0 || src.indexOf('//') >= 0) return null;
  var w = +m.w > 0 ? Math.round(+m.w) : 4, h = +m.h > 0 ? Math.round(+m.h) : 3;
  return { src: src, alt: String(m.alt || ''), w: w, h: h };
}
function itemImages(it){
  var out = [], q = it && safeImg(it.img);
  if (!it) return out;
  if (q) out.push(q.src);
  (it.options || []).forEach(function(o){ var m = safeImg(o && o.img); if (m) out.push(m.src); });
  return out;
}
function roleImages(){
  var seen = {}, out = [];
  ITEMS().forEach(function(it){ itemImages(it).forEach(function(s){ if(!seen[s]){ seen[s] = 1; out.push(s); } }); });
  return out;
}
function bust(src){ return src + (src.indexOf('?') < 0 ? '?' : '&') + 'r=' + Date.now(); }
function pic(im, badge, errText){
  return '<span class="pic" data-src="' + esc(im.src) + '" data-alt="' + esc(im.alt) + '" style="aspect-ratio:' + im.w + ' / ' + im.h + ';--ar:' + (im.w / im.h).toFixed(4) + '">'
    + '<img src="' + esc(im.src) + '" alt="' + esc(im.alt) + '" width="' + im.w + '" height="' + im.h + '" decoding="async">'
    + (badge ? '<span class="zoom-badge" aria-hidden="true">' + MAG_S + 'แตะเพื่อขยาย</span>' : '')
    + '<span class="pic-err" aria-hidden="true">' + RETRY + '<span data-msg="' + esc(errText || 'โหลดภาพไม่สำเร็จ · แตะเพื่อลองใหม่') + '">'
    + (errText || 'โหลดภาพไม่สำเร็จ · แตะเพื่อลองใหม่') + '</span></span>'
    + '</span>';
}

/* โหลดล่วงหน้า: ทั้งบทบาทตอนลงทะเบียน และข้อถัดไปหลังวาดแต่ละข้อ
   เก็บอ็อบเจกต์ Image ไว้ ให้เบราว์เซอร์ถือไฟล์ไว้ในหน่วยความจำจนถึงข้อนั้น */
var IMG = {}, HOLD = [];
function loadImg(src, cb){
  if (IMG[src] === 'ok') { if (cb) cb(true); return; }
  IMG[src] = 'load';
  var im = new Image();
  im.onload = function(){ IMG[src] = 'ok'; if (cb) cb(true); };
  im.onerror = function(){ IMG[src] = 'err'; if (cb) cb(false); };
  im.src = src;
  HOLD.push(im);
}
function prefetchItem(it){
  itemImages(it).forEach(function(s){ if (IMG[s] !== 'ok' && IMG[s] !== 'load') loadImg(s); });
}
var prep = { gen:0, total:0, ok:0, seen:0 };
function warmRoleImages(){
  var list = roleImages(), gen = ++prep.gen, next = 0;
  prep.total = list.length; prep.ok = 0; prep.seen = 0;
  function pump(){
    if (gen !== prep.gen || next >= list.length) return;
    loadImg(list[next++], function(ok){
      if (gen !== prep.gen) return;
      prep.seen++; if (ok) prep.ok++;
      paintPrep(); pump();
    });
  }
  paintPrep();
  pump(); pump();          // ทีละสองไฟล์ -- สัญญาณอ่อนไม่ควรถูกถมด้วยคำขอพร้อมกันทั้งชุด

function bankOutdated(){ return !!SRV_BANK && !!window.BANK_VERSION && SRV_BANK !== window.BANK_VERSION; }
function paintStrip(){
  var msgs = [], btn = '', scr = state.screen;
  var inExam = scr==='intro' || scr==='question' || scr==='review' || scr==='confirm';
  if (FIXTURE) msgs.push('โหมดทดสอบ (fixture) — โหลดข้อจาก _fixture และไม่ส่งคำตอบจริง');
  if (ENDPOINT.indexOf('PASTE_') === 0) msgs.push('ยังไม่ได้ตั้งค่า ENDPOINT ใน index.html — ส่งคำตอบไม่ได้ (ดู README ขั้นที่ 6)');

  } else if (bankOutdated() && inExam) {
    msgs.push('ข้อสอบในระบบถูกปรับปรุงระหว่างที่ทำ · คำตอบชุดนี้จะส่งไม่ได้ · แจ้งผู้สอน');

var toastTimer = null, toastClear = null;

}
function checkMilestones(silent){

/* ---- ปุ่มย้อนกลับของ Android: pushState ตอนกด เริ่ม/ทำต่อ แล้วแปลง back เป็น "ข้อก่อนหน้า" ---- */
var GUARDED = { intro:1, question:1, review:1, confirm:1, sending:1 };
var guardOn = !!(history.state && history.state.ssm === 'guard'), selfPop = false, selfPopTimer = null;
function pushGuard(){
  if (guardOn) return;
  try { history.pushState({ ssm: 'guard' }, ''); guardOn = true; } catch (e) {}
}
/* entry ที่ push โดยไม่มี user activation อาจถูก Chrome ข้าม -- push ใหม่ตอนผู้สอบแตะจอครั้งถัดไป */
document.addEventListener('pointerdown', function(){
  if (!guardOn && GUARDED[state.screen] && !zoomIsOpen()) pushGuard();
}, true);
function onBack(){
  var s = state.screen;
  if (s === 'question' || s === 'intro') {
    if (state.idx > 0) { state.idx--; state.screen = 'question'; save(); render(); }
    pushGuard();
  } else if (s === 'review') {
    state.idx = Math.max(0, ITEMS().length - 1); state.screen = 'question'; state.returnTo = null; save(); render(); pushGuard();
  } else if (s === 'confirm') {
    state.screen = 'review'; render(); pushGuard();
  } else if (s === 'sending') {
    toast('กำลังส่งคำตอบ · ไม่ต้องออกจากหน้านี้'); pushGuard();
  }
  // register / submitted: ปล่อยให้ออกจากหน้าได้
}

  if (it.type === 'ordering') focusEl(view.querySelector('.ord [data-mv]:not([disabled])'));
  else focusEl(view.querySelector('.sel'));
}
/* ปุ่มหลัก: aria-disabled (ไม่ใช่ disabled) เพื่อให้ยังโฟกัสได้ และกดแล้วบอกเหตุผลได้ */
function paintNext(it){
  var b = document.getElementById('next');
  if (!b) return;
  var ans = isAnswered(it), last = state.idx === ITEMS().length - 1;
  if (state.returnTo === 'review') {
    var k = missing().length;
    b.textContent = k ? 'ไปข้อที่ยังขาดถัดไป · เหลือ ' + k : 'ครบแล้ว · กลับหน้าตรวจ';
  } else {
    b.textContent = last ? 'ตรวจก่อนส่ง' : 'ถัดไป';
  }
  if (ans) { b.removeAttribute('aria-disabled'); b.classList.remove('gated'); }
  else { b.setAttribute('aria-disabled', 'true'); b.classList.add('gated'); }
}

function vQuestion(){
  var items = ITEMS(), it = items[state.idx], body = '', who = whoRow(it), fix = state.returnTo === 'review';
  if(it.type==='case'){
    body += '<div class="case">' + who + '<p class="case-title">' + esc(it.caseTitle || '') + '</p>'
          + '<p class="case-text">' + esc(String(it.caseText || '').trim()) + '</p></div>';
  } else if (who) {
    body += who;
  }
  var qim = safeImg(it.img);
  if (qim) {
    var lab = 'ภาพประกอบโจทย์' + (qim.alt ? ': ' + qim.alt : '') + ' · แตะเพื่อขยาย';
    body += '<figure class="qfig"><button type="button" class="fig-btn" data-zoom="q" data-label="' + esc(lab) + '" aria-label="' + esc(lab) + '">'
          + pic(qim, true) + '</button></figure>';
  }
  body += '<p class="stem" id="stem" tabindex="-1" aria-describedby="pcount">'+esc(it.stem)+'</p>';
  if(it.hint) body += '<p class="hint">'+esc(it.hint)+'</p>';

  if(it.type==='ordering'){
    var fresh = !isPerm(state.order[it.id], orderItems(it).length);
    var labels = orderItems(it), seq = initOrder(it);
    if (fresh) save();                              // เปิดข้อ = บันทึกลำดับที่เห็นเป็นคำตอบไว้ในร่างทันที
    body += '<p class="hint">ลากที่ปุ่มจับด้านขวา หรือใช้ปุ่มลูกศรเพื่อจัดลำดับ · ลำดับที่เห็นตอนกด “ถัดไป” คือคำตอบ</p><ul class="ord" aria-labelledby="stem">'
      + seq.map(function(v,i){
          return '<li data-v="'+v+'"><span class="rank">'+(i+1)+'</span>'
            + '<span class="ord-text">'+esc(labels[v])+'</span><span class="nudge">'
            + '<button type="button" data-mv="up"'+(i===0?' disabled':'')+' aria-label="เลื่อน &quot;'+esc(labels[v])+'&quot; ขึ้น">'+UP+'</button>'
            + '<button type="button" data-mv="down"'+(i===seq.length-1?' disabled':'')+' aria-label="เลื่อน &quot;'+esc(labels[v])+'&quot; ลง">'+DOWN+'</button>'
            + '</span><span class="grip" role="button" tabindex="-1" aria-label="ลากเพื่อจัดลำดับ">'+GRIP+'</span></li>';
        }).join('') + '</ul>';
  } else {
    var multi = it.type==='multiple', picked = state.answers[it.id] || [];
    var withImg = (it.options || []).some(function(o){ return !!safeImg(o && o.img); });
    body += withImg ? cardsHtml(it, multi, picked) : listHtml(it, multi, picked);
  }

  view.innerHTML = '<div class="stack">'+body+'</div>';

  // เลือกคำตอบไม่พาไปข้ออื่นเลย ไม่ว่าชนิดไหน (ไม่มี auto-advance)
  Array.prototype.forEach.call(view.querySelectorAll('.sel'), function(b){
    b.onclick = function(){
      var was = isAnswered(it), i = +b.dataset.i, cur = state.answers[it.id] || [];
      if(it.type==='multiple'){
        state.answers[it.id] = cur.indexOf(i)>=0
          ? cur.filter(function(x){ return x!==i; })
          : cur.concat([i]).sort(function(a,b2){ return a-b2; });
      } else {
        state.answers[it.id] = [i];
      }
      save();
      var sel = state.answers[it.id];
      Array.prototype.forEach.call(view.querySelectorAll('.sel'), function(x){
        x.setAttribute('aria-checked', sel.indexOf(+x.dataset.i)>=0);
      });
      var now = isAnswered(it);
      if (!was && now) say('ตอบข้อนี้แล้ว');
      if (now) hideGate();
      paintNext(it);
      checkMilestones(false);
    };
  });
  // ปุ่มขยายภาพ (ภาพโจทย์ทั้งกรอบ · ภาพตัวเลือกเฉพาะปุ่มแว่นขยาย) -- ไม่แตะคำตอบ
  Array.prototype.forEach.call(view.querySelectorAll('[data-zoom]'), function(b){
    b.onclick = function(){
      var p = b.dataset.zoom === 'q' ? b.querySelector('.pic') : b.parentNode.querySelector('.pic');
      if (!p || p.classList.contains('retrying')) return;
      if (p.classList.contains('err')) retryPic(p); else openZoom(p, b);
    };
  });
  if(it.type==='ordering'){ wireOrdering(it); }

  foot.hidden = false;
  var last = state.idx===items.length-1;
  foot.innerHTML = (fix
      ? '<button class="btn ghost" id="toreview">หน้าตรวจ</button>'
      : '<button class="btn ghost" id="prev"'+(state.idx===0?' disabled':'')+'>ย้อนกลับ</button>'
        + '<span class="saved" id="saved"></span>')
    + '<button class="btn next" id="next" aria-describedby="gatemsg"></button>';
  paintSaved();
  paintNext(it);
  if (fix) {
    document.getElementById('toreview').onclick = function(){ state.returnTo = null; state.screen = 'review'; save(); render(); };
  } else {
    document.getElementById('prev').onclick = function(){ state.idx--; save(); render(); };
  }
  document.getElementById('next').onclick = function(){
    if (it.type === 'ordering') { commitOrder(it); checkMilestones(false); }   // กดถัดไป = ยืนยันลำดับที่เห็น
    if (!isAnswered(it)) { showGate(); focusFirst(it); return; }     // ไม่มีข้าม (OD-1)
    if (state.returnTo === 'review') {
      var m = missing();
      if (!m.length) { state.returnTo = null; state.screen = 'review'; }
      else {
        var after = m.filter(function(i){ return i > state.idx; });
        state.idx = after.length ? after[0] : m[0];
      }
      save(); render(); return;
    }
    if(last){ state.screen='review'; }
    else {
      state.idx++;
      var np = ITEMS()[state.idx].part;
      if (np !== it.part && !state.introSeen[np]) state.screen = 'intro';
    }
    save(); render();
  };
  focusEl(document.getElementById('stem'), true);
  prefetchItem(items[state.idx + 1]);
}

/* ---- สถานะภาพในหน้าจอ: ดักที่ view แบบ capture จึงไม่พลาดแม้ภาพโหลดเสร็จก่อนผูก handler ---- */
function onPicEvent(e){
  var img = e.target;
  if (!img || img.tagName !== 'IMG') return;
  var p = img.parentNode;
  if (!p || !p.classList || !p.classList.contains('pic')) return;
  var ok = e.type === 'load', msg = p.querySelector('.pic-err span');
  IMG[p.dataset.src] = ok ? 'ok' : 'err';
  p.classList.remove('retrying');
  if (msg) msg.textContent = msg.getAttribute('data-msg');
  if (ok) p.classList.remove('err'); else p.classList.add('err');
  var card = p.closest ? p.closest('.card') : null;
  if (card) {
    var z = card.querySelector('.card-zoom');
    if (z) { z.innerHTML = ok ? MAG : RETRY; z.setAttribute('aria-label', (ok ? 'ขยายภาพตัวเลือก ' : 'โหลดภาพตัวเลือกใหม่ ') + z.dataset.l); }
    return;
  }
  var fb = p.closest ? p.closest('.fig-btn') : null;
  if (fb) fb.setAttribute('aria-label', ok ? fb.dataset.label : 'โหลดภาพไม่สำเร็จ แตะเพื่อลองใหม่');
}
view.addEventListener('load', onPicEvent, true);
view.addEventListener('error', onPicEvent, true);
function retryPic(p){
  var img = p.querySelector('img'), msg = p.querySelector('.pic-err span');
  if (p.classList.contains('retrying')) return;
  p.classList.remove('err');
  p.classList.add('retrying');                    // ระหว่างรอ: ไอคอนหมุน + ข้อความ ไม่ปล่อยเป็นกล่องว่าง
  if (msg) msg.textContent = 'กำลังโหลดภาพใหม่…';
  IMG[p.dataset.src] = 'load';
  img.src = bust(p.dataset.src);
}

/* ---- ภาพขยายเต็มจอ: <dialog> + pushState ให้ปุ่มย้อนกลับของ Android ปิดภาพ ไม่ใช่ออกจากข้อสอบ ---- */
var zoom = document.getElementById('zoom'), zimg = document.getElementById('zimg'), zcap = document.getElementById('zcap'),
    zclose = document.getElementById('zclose'), zstage = document.getElementById('zstage'), zerr = document.getElementById('zerr');
var zoomPushed = false, zoomTrigger = null;
function zoomIsOpen(){ return zoom.hasAttribute('open'); }
function openZoom(p, trigger){
  var img = p.querySelector('img');
  zerr.hidden = true;
  zstage.classList.remove('actual');
  zimg.alt = p.dataset.alt || '';
  zcap.textContent = p.dataset.alt || '';
  zimg.src = img.currentSrc || img.src;
  zoomTrigger = trigger || null;
  if (typeof zoom.showModal === 'function') zoom.showModal(); else zoom.setAttribute('open', '');
  try { history.pushState({ ssmZoom: 1 }, ''); zoomPushed = true; } catch (e) { zoomPushed = false; }
  zstage.scrollTop = 0; zstage.scrollLeft = 0;
  zclose.focus();
}
function closeZoom(){
  if (!zoomIsOpen()) return;
  if (typeof zoom.close === 'function') zoom.close();
  else { zoom.removeAttribute('open'); onZoomClosed(); }
}
function onZoomClosed(){
  var t = zoomTrigger; zoomTrigger = null;
  if (zoomPushed) {
    zoomPushed = false; selfPop = true;
    clearTimeout(selfPopTimer); selfPopTimer = setTimeout(function(){ selfPop = false; }, 800);
    try { history.back(); } catch (e) { selfPop = false; }
  }
  resetPinch();
  if (t && document.body.contains(t)) { try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); } }
}
/* ซูมด้วยสองนิ้วค้างไว้หลังปิดภาพ -- บีบ maximum-scale ชั่วครู่ให้เบราว์เซอร์คืนขนาดปกติ */
function resetPinch(){
  var m = document.querySelector('meta[name="viewport"]');
  if (!m || !window.visualViewport || window.visualViewport.scale <= 1.01) return;
  var c = m.getAttribute('content');
  m.setAttribute('content', c + ', maximum-scale=1');
  setTimeout(function(){ m.setAttribute('content', c); }, 300);
}
zoom.addEventListener('close', onZoomClosed);
window.addEventListener('popstate', function(){
  if (selfPop) { selfPop = false; clearTimeout(selfPopTimer); return; }   // เราย้อนเองตอนปิดภาพ -- ไม่ใช่ผู้สอบกดย้อน
  if (zoomIsOpen()) { zoomPushed = false; closeZoom(); return; }
  if (askEl.hasAttribute('open')) { askCb = null; askEl.close(); if (GUARDED[state.screen]) { guardOn = false; pushGuard(); } return; }
  guardOn = !!(history.state && history.state.ssm === 'guard');
  if (guardOn) return;
  onBack();
});
zclose.onclick = closeZoom;
zstage.onclick = function(e){ if (e.target === zimg) zstage.classList.toggle('actual'); };
zimg.onload = function(){ zerr.hidden = true; };
zimg.onerror = function(){ if (zimg.getAttribute('src')) zerr.hidden = false; };
zerr.onclick = function(){ zerr.hidden = true; zimg.src = bust(zimg.src.replace(/[?&]r=\d+$/, '')); };

/* ---- การจัดลำดับ ---- */
var drag = null;
function commitOrder(it){
  var list = view.querySelector('.ord'); if(!list) return;
  var rows = Array.prototype.slice.call(list.children);
  state.order[it.id] = rows.map(function(li){ return +li.dataset.v; });
  save();
  rows.forEach(function(li,i){
    li.querySelector('.rank').textContent = i+1;
    li.querySelector('[data-mv="up"]').disabled   = i===0;
    li.querySelector('[data-mv="down"]').disabled = i===rows.length-1;
  });
}
function wireOrdering(it){
  var list = view.querySelector('.ord'); if(!list) return;
  Array.prototype.forEach.call(list.querySelectorAll('[data-mv]'), function(b){
    b.onclick = function(){
      var li = b.parentNode.parentNode;
      if(b.dataset.mv==='up'){ var p=li.previousElementSibling; if(p) list.insertBefore(li,p); }
      else { var n=li.nextElementSibling; if(n) list.insertBefore(n,li); }
      commitOrder(it);
      if(!b.disabled) b.focus();
    };
  });
  Array.prototype.forEach.call(list.querySelectorAll('.grip'), function(g){
    g.onpointerdown = function(e){
      if(e.button && e.button!==0) return;
      e.preventDefault();
      drag = { li:g.parentNode, list:list, it:it, y:e.clientY, id:e.pointerId };
      drag.li.classList.add('dragging');
    };
  });
}
window.addEventListener('pointermove', function(e){
  if(!drag || e.pointerId!==drag.id) return;
  e.preventDefault();
  drag.li.style.transform = 'translateY('+(e.clientY-drag.y)+'px)';
  var el = document.elementFromPoint(e.clientX, e.clientY);
  var row = el && el.closest ? el.closest('.ord > li') : null;
  if(row && row!==drag.li && drag.list.contains(row)){
    var r = row.getBoundingClientRect();
    drag.list.insertBefore(drag.li, (e.clientY < r.top + r.height/2) ? row : row.nextSibling);
    drag.y = e.clientY;
    drag.li.style.transform = 'translateY(0)';
  }
}, {passive:false});
function endDrag(){
  if(!drag) return;
  drag.li.classList.remove('dragging');
  drag.li.style.transform = '';
  var it = drag.it; drag = null;
  commitOrder(it);
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* ---- หน้าตรวจ: ส่งได้เมื่อตอบครบทุกข้อเท่านั้น ---- */

  view.innerHTML = '<div class="stack"><div class="stack-sm">'
    + '<p class="eyebrow">ขั้นสุดท้าย</p><h1 id="rh1" tabindex="-1">ตรวจก่อนส่งคำตอบ</h1></div>'

    + (m ? '<button class="btn" id="fix">ไปทำข้อที่ยังขาด (' + m + ')</button>'
         : '<button class="btn" id="submit">ส่งคำตอบ</button>');
  document.getElementById('first').onclick = function(){ state.idx = 0; state.returnTo = null; state.screen = 'question'; save(); render(); };
  if (m) document.getElementById('fix').onclick = function(){ jump(miss[0]); };
  else document.getElementById('submit').onclick = function(){ state.screen = 'confirm'; render(); };

/* ---- payload -- สร้างครั้งเดียวตอนกดยืนยันส่ง แล้วแช่แข็งไว้ใน outbox (submittedAt/clientToken ไม่เปลี่ยนอีก · D4) ---- */
function payload(){
  return {
    clientToken: state.clientToken,
    bankVersion: state.bankVersion || window.BANK_VERSION || '',
    role: state.role, session: state.session, track: state.track,
    name: state.profile.name, department: state.profile.dept,
    startedAt: state.startedAt, submittedAt: Date.now(),
    responses: (function(){
      var r = {};
      ITEMS().forEach(function(it){
        r[it.id] = it.type==='ordering' ? (state.order[it.id]||[]) : (state.answers[it.id]||[]);
      });
      return r;
    })()
  };
}
/*
 * ส่งจนกว่าจะสำเร็จ -- ไม่มีเพดานจำนวนครั้ง (D2)
 *
 * Apps Script ที่ว่างงานต้อง "ตื่น" ก่อน (cold start วัดจริง 42 วินาที 2026-09-18) และรอล็อกได้ 30 วินาที
 * 1. warm() ปลุกเซิร์ฟเวอร์ล่วงหน้าด้วย GET ที่ไม่แตะชีต -- ตอนเปิดหน้า ต้นหมวด และหน้าตรวจ (อ่าน bank_version ไปด้วย)
 * 2. คำขอหนึ่งครั้งรอได้ SEND_TIMEOUT_MS (45 วินาที > ล็อก 30 วินาที)
 * 3. ล้มแล้วเว้น 2 → 4 → 8 → 15 → 30 → 30 … วินาที (±20%) ไม่หยุด ปลอดภัยเพราะเซิร์ฟเวอร์กันซ้ำด้วย clientToken
 *    คำขอที่หมดเวลาฝั่ง client อาจบันทึกสำเร็จฝั่งเซิร์ฟเวอร์แล้ว ครั้งถัดไปจะได้ใบรับเดิม ไม่ใช่แถวใหม่
 * 4. outbox อยู่ใน localStorage ก่อนยิงครั้งแรก -- ปิดหน้า/รีโหลดแล้วสแกน QR เดิม ระบบส่งต่อเอง (D3)
 * ออกจากวงนี้ได้สองทางเท่านั้น: สำเร็จ หรือเซิร์ฟเวอร์ตอบ BANK_VERSION (ลองซ้ำไม่มีวันช่วย)
 * จัดประเภทจากสัญญาณของ transport/เซิร์ฟเวอร์เท่านั้น ไม่อ่านข้อความ error
 */
var QS = new URLSearchParams(location.search);
var FAST = FIXTURE && QS.get('fastretry') === '1';       // เฉพาะชุดทดสอบ: หน่วงเวลา /20 และหมดเวลา 2 วินาที
var SEND_TIMEOUT_MS = FAST ? 2000 : 45000;
var RETRY_DELAYS_MS = [2000, 4000, 8000, 15000, 30000];  // หลังจากนั้น 30 วินาทีไปเรื่อย ๆ
var SAFETY_POLL_MS  = 60000;
var WARM_EVERY_MS   = 60000;
var lastWarm = 0, SRV_BANK = null;
var SEND = { inflight:false, timer:null, tick:null, safety:null, nextAt:0, kind:'sending', lastTitle:'', footFor:'' };

/* จุดเดียวที่คุยกับ ENDPOINT -- โหมดทดสอบใช้ตัวจำลองจาก fixture และไม่มีทางยิงออกไปจริง */
function net(url, opts){
  if (FIXTURE) {
    return typeof window.FIXTURE_FETCH === 'function'
      ? window.FIXTURE_FETCH(url, opts)
      : Promise.reject(new Error('โหมดทดสอบ: ไม่มีตัวจำลองการส่ง'));
  }
  return fetch(url, opts);
}

function warm(){
  if (ENDPOINT.indexOf('PASTE_') === 0) return;
  var now = Date.now();
  if (now - lastWarm < WARM_EVERY_MS) return;
  lastWarm = now;
  net(ENDPOINT + '?action=warm', { method: 'GET', cache: 'no-store' })
    .then(function(r){ return (r && r.ok) ? r.text() : ''; })
    .then(function(t){
      var j; try { j = JSON.parse(t); } catch (e) { return; }      // cold start ตอบเป็น HTML -- ไม่มีข้อมูลก็ไม่ทำอะไร
      if (j && typeof j.bank_version === 'string' && j.bank_version) {
        SRV_BANK = j.bank_version;
        paintStrip(); updateStart();
      }
    })
    .catch(function(){});
}

/* ยิงหนึ่งครั้ง คืนผลเป็นประเภทเสมอ (ไม่ reject) -- หมดเวลานับรวมการอ่าน body ด้วย */
function postOnce(body, ms){
  return new Promise(function(resolve){
    var done = false, ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null, timer;
    function fin(o){ if (done) return; done = true; clearTimeout(timer); resolve(o); }
    function failKind(e){ return (e && e.name === 'AbortError') ? 'slow' : (navigator.onLine === false ? 'offline' : 'net'); }
    timer = setTimeout(function(){ if (ctl) { try { ctl.abort(); } catch (e) {} } fin({ kind: 'slow' }); }, ms);
    // ห้ามตั้ง Content-Type เอง -- จะกลายเป็น preflight OPTIONS ที่ Apps Script ตอบไม่ได้ (body สตริง = text/plain = simple request)
    var opts = { method: 'POST', body: body };
    if (ctl) opts.signal = ctl.signal;
    var p;
    try { p = net(ENDPOINT, opts); } catch (e) { fin({ kind: failKind(e) }); return; }
    p.then(function(r){
      if (!r || !r.ok) { fin({ kind: 'server' }); return; }
      return r.text().then(function(t){
        var j;
        try { j = JSON.parse(t); } catch (e) { fin({ kind: 'server' }); return; }   // 200 แต่เป็น HTML (cold start)
        if (j && j.ok === true) fin({ kind: 'ok', res: j });
        else if (j && j.code === 'BANK_VERSION') fin({ kind: 'bank', res: j });
        else fin({ kind: 'busy' });                                                // BUSY และ ok:false อื่นทั้งหมด -- ลองใหม่
      });
    }).catch(function(e){ fin({ kind: failKind(e) }); });
  });
}

/* ชื่อเดิมยังใช้ได้ -- ทุกทางเข้าผ่านด่าน missing() เดียวกัน */
function submit(){ queueSubmit(); }
function queueSubmit(){
  if (state.outbox) {                           // มี outbox แล้ว = ห้ามสร้าง token/submittedAt ใหม่ แค่ส่งต่อ
    if (state.screen !== 'sending') { state.screen = 'sending'; render(); }
    kick('user');
    return;
  }
  if (!BANK.ready || !ITEMS().length || missing().length) {   // ด่านที่ข้อมูล: ยังไม่ครบ = ไม่มี POST
    state.screen = 'review'; save(); render();
    return;
  }
  state.outbox = { payload: payload(), queuedAt: Date.now(), attempts: 0, lastAt: null };
  state.screen = 'sending';
  save();                                       // เก็บลงเครื่องก่อนยิงครั้งแรกเสมอ
  render();
  kick('initial');
}
function kick(why){
  var ob = state.outbox;
  if (!ob || ob.terminal || SEND.inflight) return;           // ส่งได้ทีละคำขอเดียว
  clearTimeout(SEND.timer); SEND.timer = null; SEND.nextAt = 0; stopTick();
  if (navigator.onLine === false && why !== 'user' && why !== 'poll') {
    SEND.kind = 'offline'; paintSending(); armSafety();
    return;
  }
  attemptSend();
}
function armSafety(){ clearTimeout(SEND.safety); SEND.safety = setTimeout(function(){ kick('poll'); }, SAFETY_POLL_MS); }
function attemptSend(){
  var ob = state.outbox;
  SEND.inflight = true;
  clearTimeout(SEND.safety);
  ob.attempts = (ob.attempts || 0) + 1;
  ob.lastAt = Date.now();
  save();
  SEND.kind = 'sending';
  paintSending();
  postOnce(JSON.stringify(ob.payload), SEND_TIMEOUT_MS).then(function(o){
    SEND.inflight = false;
    onOutcome(o);
  });
}
function onOutcome(o){
  if (!state.outbox) return;
  if (o.kind === 'ok') { sendDone(o.res); return; }
  if (o.kind === 'bank') {                     // จบ -- ไม่ลองซ้ำ แต่ไม่ลบ outbox เอง (ผู้สอบกดโหลดรุ่นใหม่เอง)
    state.outbox.terminal = true; save();
    SEND.kind = 'terminal'; paintSending();
    return;
  }
  if (o.kind === 'offline') { SEND.kind = 'offline'; paintSending(); armSafety(); return; }
  var n = state.outbox.attempts, base = RETRY_DELAYS_MS[Math.min(n - 1, RETRY_DELAYS_MS.length - 1)];
  var ms = Math.round(base * (0.8 + Math.random() * 0.4) / (FAST ? 20 : 1));
  SEND.kind = o.kind;
  SEND.nextAt = Date.now() + ms;
  SEND.timer = setTimeout(function(){ SEND.timer = null; kick('timer'); }, ms);
  paintSending();
  stopTick();
  SEND.tick = setInterval(paintCountdown, 1000);
}
function stopTick(){ if (SEND.tick) { clearInterval(SEND.tick); SEND.tick = null; } }
function secsLeft(){ return Math.max(0, Math.ceil((SEND.nextAt - Date.now()) / 1000)); }
function paintCountdown(){ var el = document.getElementById('scount'); if (el) el.textContent = String(secsLeft()); }
function sendDone(res){
  var p = state.outbox.payload;
  var rc = { attemptId: res.attemptId || '', submittedAt: res.submittedAt || '', name: p.name, dept: p.department,
             role: p.role, session: p.session, clientToken: p.clientToken,
             answeredCount: res.answeredCount, totalItems: res.totalItems, duplicate: !!res.duplicate };
  try { localStorage.setItem(RECEIPT_KEY, JSON.stringify(rc)); } catch (e) {}   // ใบรับก่อน แล้วค่อยลบร่าง
  clearTimeout(SEND.timer); clearTimeout(SEND.safety); stopTick();
  clearDraft();
  state.outbox = null; state.receipt = rc; state.still = false; state.screen = 'submitted';
  render();
}
function refCode(){
  var t = String((state.outbox && state.outbox.payload && state.outbox.payload.clientToken) || state.clientToken || '')
            .replace(/-/g, '').slice(0, 8).toUpperCase();
  return t.slice(0, 4) + '-' + t.slice(4);
}

/* อัปเดตหน้ากำลังส่งในที่เดิม -- #live ได้เฉพาะหัวข้อสถานะเมื่อเปลี่ยน ตัวนับถอยหลังอยู่นอก live region */
function paintSending(){
  var ob = state.outbox, h1 = document.getElementById('sh1');
  if (state.screen !== 'sending' || !ob || !h1) return;
  var n = Object.keys(ob.payload.responses || {}).length, k = ob.attempts || 0;
  var kind = ob.terminal ? 'terminal' : SEND.kind, title, body;
  if (kind === 'sending') {
    title = k <= 1 ? 'กำลังส่งคำตอบ' : 'กำลังส่งคำตอบ (ครั้งที่ ' + k + ')';
    body  = k <= 1 ? 'กำลังส่งคำตอบ ' + n + ' ข้อไปที่ระบบ · ไม่ต้องกดอะไร' : 'กำลังลองส่งอีกครั้ง · ไม่ต้องกดอะไร';
  } else {
    title = SEND_COPY[kind][0]; body = SEND_COPY[kind][1];
  }
  h1.textContent = title;
  document.getElementById('sbody').innerHTML = esc(body).replace('{s}', '<span id="scount">' + secsLeft() + '</span>');
  var ico = document.getElementById('sico');
  ico.className = 'send-ico' + (kind === 'terminal' ? ' bad' : kind === 'sending' ? '' : ' wait');
  ico.innerHTML = kind === 'sending' ? '<span class="spin big" aria-hidden="true"></span>'
                : kind === 'terminal' ? ICO_BANK : kind === 'offline' ? ICO_OFF : ICO_WAIT;
  document.getElementById('scard').hidden = kind === 'terminal';
  document.getElementById('sline1').textContent = storageOk
    ? 'คำตอบครบ ' + n + ' ข้อ เก็บไว้ในเครื่องนี้แล้ว'
    : 'ยังเก็บคำตอบในเครื่องไม่ได้ · อย่าปิดหน้านี้จนกว่าจะส่งสำเร็จ';
  document.getElementById('sline3').hidden = !storageOk;
  var meta = document.getElementById('smeta');
  meta.textContent = (k && kind !== 'terminal') ? 'ลองส่งแล้ว ' + k + ' ครั้ง · ล่าสุด ' + hhmm(ob.lastAt) + ' น.' : '';
  var escl = document.getElementById('sesc');
  var late = kind !== 'terminal' && ((Date.now() - ob.queuedAt) >= 120000 || k >= 6);
  escl.hidden = !late;
  if (late) escl.innerHTML = 'ถ้ายังไม่สำเร็จภายใน 10 นาที แจ้งผู้สอนพร้อมรหัสนี้: <b class="code">' + esc(refCode()) + '</b>';
  var want = kind === 'terminal' ? 'terminal' : kind === 'sending' ? '' : 'now';
  if (want !== SEND.footFor) {
    SEND.footFor = want;
    if (!want) { foot.hidden = true; foot.innerHTML = ''; }
    else if (want === 'now') {
      foot.hidden = false;
      foot.innerHTML = '<button class="btn" id="sendnow">ลองส่งตอนนี้</button>';
      document.getElementById('sendnow').onclick = function(){ kick('user'); };
    } else {
      foot.hidden = false;
      foot.innerHTML = '<button class="btn" id="reloadbank">โหลดข้อสอบรุ่นใหม่</button>';
      var rb = document.getElementById('reloadbank');
      rb.onclick = function(){ state.outbox = null; clearDraft(); reloadFresh(); };
      focusEl(rb);
    }
  }
  if (title !== SEND.lastTitle) { SEND.lastTitle = title; say(title); }
}

var BANK_BUST = (function(){
  try { var v = sessionStorage.getItem('ssm-bank-bust'); if (v) sessionStorage.removeItem('ssm-bank-bust'); return v; }
  catch (e) { return null; }
})();
function loadBank(){
  BANK.failed = false; BANK.tries++; BANK.total++;
  var s = document.createElement('script');
  s.src = BANK_SRC + (BANK_BUST ? '?v=' + BANK_BUST : (BANK.total > 1 ? '?r=' + Date.now() : ''));
  s.onload = function(){
    if (window.ITEMS_BY_ROLE && typeof window.ITEMS_BY_ROLE === 'object') { BANK.ready = true; onBankReady(); }
    else bankFailed();
  };
  s.onerror = function(){ if (s.parentNode) s.parentNode.removeChild(s); bankFailed(); };
  document.head.appendChild(s);
}
function bankFailed(){
  if (BANK.tries < 3) { setTimeout(loadBank, 1500 * BANK.tries); return; }
  BANK.failed = true;
  if (state.screen === 'register') refreshRegisterBits();
}
function onBankReady(){
  paintStrip();
  if (state.screen === 'register') { refreshRegisterBits(); warmRoleImages(); }
}
/* ใบรับของ QR นี้ (บทบาท + รุ่นเดียวกัน) -- เครื่องนี้ส่งแล้ว ไม่ให้ทำซ้ำ (OD-2)
   QR ที่ไม่มีบทบาทเทียบแค่รุ่น เพราะบอกไม่ได้ว่าเป็นบทบาทอื่นจริง */
function receiptForThisQR(){
  var rc = readJSON(RECEIPT_KEY);
  if (!rc || !rc.attemptId) return null;
  if (rc.session !== state.session) return null;
  if (QR.role && rc.role !== QR.role) return null;
  return rc;
}
function boot(){
  var d = readDraft();
  if (d && d.outbox && d.outbox.payload) {
    // (i) กดส่งไว้แล้วแต่ยังไม่ถึงระบบ -- ส่งต่อทันทีโดยไม่รอ items.js (payload แช่แข็งไว้ครบแล้ว)
    // ไม่ทิ้ง outbox เพราะรุ่นคลังข้อต่าง: เซิร์ฟเวอร์เช็ก token ก่อนรุ่น ครั้งแรกที่บันทึกไปแล้วจะได้ใบรับเดิม
    adopt(d);
    state.screen = 'sending';
    if (d.outbox.terminal) SEND.kind = 'terminal';
    render();
    kick('boot');
  } else {
    var rc = receiptForThisQR();
    if (rc) {                                   // (ii) ส่งแล้วจากเครื่องนี้ -- แสดงใบรับเดิม ไม่มีทางเริ่มใหม่
      state.role = rc.role; state.session = rc.session; state.receipt = rc;
      state.still = true; state.screen = 'submitted';
    }
    render();                                   // (iii) ร่างค้าง -- การ์ดทำต่อบนหน้าลงทะเบียน
  }
  warm();
  loadBank();
}

      + '\ninset top ' + ps.paddingTop + ' · bottom ' + ps.paddingBottom
      + '\nfooter bottom ' + (fr ? Math.round(fr.bottom) : '-')
      + '\n' + navigator.userAgent;
  }
  paint();
  window.addEventListener('resize', paint);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', paint);
  setInterval(paint, 1000);
})();

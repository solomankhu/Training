<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ภาพชุดส่งต่องานจาก Presales ของ NSL-01 คู่กับตารางสถานะแถวใน gap list หลังการสำรวจ</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<rect x="16" y="10" width="608" height="160" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 18 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="27" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">ชุดส่งต่องานจาก Presales  NSL-01</text>
<text x="28" y="58" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">MD งาน customise ก่อนตัด  60 MD</text>
<text x="28" y="88" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">MD งาน customise ในใบเสนอราคา  48 MD  (ตัดลงร้อยละ 20)</text>
<text x="28" y="118" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">บันทึกเหตุผลของการตัด  ไม่มี</text>
<text x="28" y="148" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">เกณฑ์การตัด MD ในใบเสนอราคา  เกินร้อยละ 10 (ค่าตั้งต้น)</text>
<text x="16" y="205" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#008271" text-anchor="start" xml:space="preserve" style="white-space:pre">gap list  NSL-01  หลังการสำรวจ</text>
<rect x="16" y="214" width="608" height="26" rx="0" fill="#008271"/>
<text x="24" y="232.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">สถานะใน gap list</text>
<text x="284" y="232.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">จำนวนแถว</text>
<text x="444" y="232.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">MD</text>
<rect x="16" y="240" width="608" height="26" rx="0" fill="#FFFFFF"/>
<text x="24" y="258.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Confirm</text>
<text x="284" y="258.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">10</text>
<text x="444" y="258.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">58</text>
<rect x="16" y="266" width="608" height="26" rx="0" fill="#F4F6F6"/>
<text x="24" y="284.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Cancel</text>
<text x="284" y="284.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">1</text>
<text x="444" y="284.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">2</text>
<rect x="16" y="214" width="608" height="78" rx="0" fill="none" stroke="#C5D0CF" stroke-width="1"/>

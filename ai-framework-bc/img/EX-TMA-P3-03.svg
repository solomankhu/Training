<text x="32" y="211" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">DEF-86  หมายเหตุ  แก้แล้วใน DEF-81</text>
<text x="32" y="241" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">คุณเมย์  ทดสอบ DEF-86 ได้เมื่อ DEF-81 แก้เสร็จ</text>
<text x="32" y="271" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">DEF-81 และ DEF-84  เปิดจากคำแจ้งของผู้ใช้คนละคน</text>
</svg>

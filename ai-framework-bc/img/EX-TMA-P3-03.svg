<text x="106" y="165.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ใบรับสินค้า Lot เดิมพิมพ์ซ้ำ</text>

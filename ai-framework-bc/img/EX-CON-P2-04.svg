<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ภาพสารบัญ BI ระบบผลิตรุ่น 0.9 ของ SCP-INS คู่กับบันทึกการประชุม BI วันที่ 2026-10-14</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<rect x="16" y="10" width="608" height="195" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 18 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="27" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">BI ระบบผลิต  SCP-INS  รุ่น 0.9  สารบัญ</text>
<text x="28" y="59" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">1. กระบวนการปัจจุบัน (as-is)</text>
<text x="28" y="90" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">2. กระบวนการใหม่ (to-be)</text>
<text x="28" y="121" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">3. ขอบงานมาตรฐานในระดับผู้ใช้</text>
<text x="28" y="152" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">4. Out-of-scope   (ว่าง)</text>
<text x="28" y="183" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">5. GAP ที่พบ</text>
<rect x="16" y="219" width="608" height="102" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 227 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="236" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">บันทึกการประชุม BI  2026-10-14</text>
<text x="28" y="268" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">รูปแบบ  ทีมนำเสนอขั้นตอนใหม่ด้วยสไลด์</text>
<text x="28" y="299" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">นัดส่ง BI ให้ลูกค้ายืนยัน  2026-10-21</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ภาพแถว DEF-NSL-31 ใน defect log ของ NSL-01 คู่กับภาพ error ที่ผู้ใช้แนบ</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<text x="16" y="25" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#008271" text-anchor="start" xml:space="preserve" style="white-space:pre">defect log  NSL-01</text>
<rect x="16" y="34" width="608" height="24" rx="0" fill="#008271"/>
<text x="24" y="50.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">DEF</text>
<text x="136" y="50.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">เรื่อง</text>
<text x="372" y="50.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">ผู้ใช้แจ้ง</text>
<text x="476" y="50.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">ส่งต่อ</text>
<text x="548" y="50.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">สถานะ</text>
<rect x="16" y="58" width="608" height="24" rx="0" fill="#FFFFFF"/>
<text x="24" y="74.68" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">DEF-NSL-31</text>
<text x="136" y="75.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ใบแจ้งหนี้ค่าขนส่ง บรรทัด G/L</text>
<text x="372" y="75.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Program bug</text>
<text x="476" y="75.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">คุณบอส</text>
<text x="548" y="75.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">รอแก้โค้ด</text>
<rect x="16" y="34" width="608" height="48" rx="0" fill="none" stroke="#C5D0CF" stroke-width="1"/>
<rect x="16" y="98" width="608" height="160" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 106 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="115" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">ภาพ error ที่ผู้ใช้แนบ</text>
<text x="28" y="145" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">The General Posting Setup does not exist.</text>
<text x="28" y="175" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Gen. Bus. Posting Group = 'DOMESTIC'</text>
<text x="28" y="205" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Gen. Prod. Posting Group = 'FREIGHT'</text>
<text x="28" y="235" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ผู้ใช้เลือกบัญชี G/L เองในบรรทัดของใบแจ้งหนี้</text>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ภาพ FDD ฉบับฐานของ GAP-MFG-47 ที่ลูกค้ายืนยัน 2026-09-05 คู่กับผลรัน test ของร่าง R-SCP-12 และหมายเหตุของคุณบอส</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<rect x="16" y="8" width="608" height="152" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 16 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="25" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">FDD GAP-MFG-47  ฉบับฐาน 1.0  ลูกค้ายืนยัน 2026-09-05</text>
<text x="28" y="55" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">TC-GAP-MFG-47-02   แบบ Auto</text>
<text x="28" y="83" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Given  เลขที่เอกสาร JV-001 post ไปแล้ว</text>
<text x="28" y="111" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">When  ผู้ใช้ post สมุดรายวันที่ใช้เลข JV-001 อีกครั้ง</text>
<text x="28" y="139" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Then  ระบบปฏิเสธการ post และแจ้งว่าเลขซ้ำ</text>
<rect x="16" y="170" width="608" height="96" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 178 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="187" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">ผลรัน test  ร่าง R-SCP-12</text>
<text x="28" y="217" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">TC-GAP-MFG-47-02   FAIL</text>
<text x="28" y="245" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ร่างแสดงคำเตือน แล้วให้ผู้ใช้ post ต่อได้</text>
<rect x="16" y="276" width="608" height="46" rx="8" fill="#F4F6F6"/>
<text x="32" y="301" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">หมายเหตุคุณบอส  ทำเป็นคำเตือน เพราะผู้ใช้บางคนต้อง post เลขซ้ำ</text>
</svg>

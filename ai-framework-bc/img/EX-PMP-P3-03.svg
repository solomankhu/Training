<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ทะเบียนการตัดสินใจใน wiki ของ SCP-INS มีการยกเลิก GAP-MFG-38 ที่ไม่มีวันที่และผู้ตัดสิน และมีแถวที่ยังรอลูกค้ายืนยันถูกบันทึกเป็นการตัดสินใจ</title>

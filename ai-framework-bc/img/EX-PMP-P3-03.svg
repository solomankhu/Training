<text x="84" y="149.12" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ใช้ต้นทุนมาตรฐานรายกลุ่มสินค้า</text>

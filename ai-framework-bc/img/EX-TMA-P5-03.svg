<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>คำขอผ่านช่องทาง support ของ GOF-INS หลังขึ้นระบบที่ขอรายงานยอดขายรายเส้นทางและติดป้ายว่า bug คู่กับรายการไม่รวมใน BI ระบบขายรุ่นที่ลูกค้ายืนยัน</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<rect x="16" y="10" width="608" height="164" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 18 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="27" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">ช่องทาง support  เกรทวัน ฟู้ดส์  GOF-INS  ISS-203</text>
<text x="28" y="58" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ผู้แจ้ง  คุณนิดา     แจ้งเมื่อ  สองสัปดาห์หลังขึ้นระบบ</text>
<text x="28" y="89" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ป้ายที่ลูกค้าติด  bug  งานเดิมส่งมอบไม่ครบ</text>
<text x="28" y="120" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">เรื่อง  ขอรายงานยอดขายรายเส้นทางส่งสินค้า แยกตามเดือน</text>
<text x="28" y="151" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ผู้รับเรื่อง  คุณกอล์ฟ     ประเภท  (ยังไม่คัดแยก)</text>
<rect x="16" y="190" width="608" height="102" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 198 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="207" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">BI ระบบขาย  รุ่นที่ลูกค้ายืนยัน  ส่วนรายการไม่รวม</text>
<text x="28" y="238" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">1  รายงานวิเคราะห์ที่ไม่อยู่ในรายงานมาตรฐานของระบบ</text>
<text x="28" y="269" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">2  แบบฟอร์มพิมพ์เกิน 2 แบบต่อเอกสาร</text>
</svg>

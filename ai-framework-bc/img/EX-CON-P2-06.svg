<text x="28" y="109" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">endpoint  https://{wms-host}/api/receipts</text>
<text x="28" y="136" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ยืนยันตัวตน  อ้างชื่อรายการในที่เก็บรหัสลับ</text>

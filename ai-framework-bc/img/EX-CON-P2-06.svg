<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ภาพร่าง spec ของ interface WMS รุ่น 0.3 ของ SCP-INS คู่กับรายการฟิลด์ใน FDD ของ GAP-WMS-42</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<rect x="16" y="8" width="608" height="256" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>

<text x="28" y="25" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">spec interface WMS  SCP-INS  รุ่น 0.3  GAP-WMS-42</text>
<text x="28" y="55" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ภาพรวม  WMS ส่งผลการรับสินค้า แล้ว BC Post ใบรับสินค้า</text>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>แผนและบันทึก SIT ของ interface กับระบบจัดการสต็อกอาหารของ GOF-INS มีการพัฒนาก่อนวันยืนยัน spec ลูกค้าส่ง endpoint ช้าหลายสัปดาห์ และผล SIT 2 วันทดสอบถูกบันทึกเป็นวันเดียวพร้อมหมายเหตุตกลงกันว่า SIT ผ่าน</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<text x="16" y="29" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#008271" text-anchor="start" xml:space="preserve" style="white-space:pre">GOF-INS  interface กับระบบจัดการสต็อกอาหาร</text>
<rect x="16" y="38" width="608" height="34" rx="0" fill="#008271"/>
<text x="24" y="60.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">งาน</text>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ภาพแชทของคุณต้นกับผู้ช่วยในโครงการ GOF-INS เรื่องการอนุมัติใบสั่งขาย</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<rect x="16" y="10" width="608" height="340" rx="10" fill="#F4F6F6" stroke="#C5D0CF" stroke-width="1"/>
<text x="32" y="36" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">แชทกับผู้ช่วย  โครงการ GOF-INS</text>
<rect x="306.09999999999997" y="50" width="301.90000000000003" height="40" rx="12" fill="#008271"/>
<text x="320.09999999999997" y="76" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">ใบสั่งขายต้องอนุมัติกี่ระดับ ใครอนุมัติ</text>
<text x="608" y="106" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" fill="#6B6B6B" text-anchor="end" xml:space="preserve" style="white-space:pre">คุณต้น</text>
<rect x="32" y="122" width="560" height="160" rx="12" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<text x="48" y="152" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">อนุมัติ 2 ระดับ คือหัวหน้าฝ่ายขาย และผู้จัดการฝ่ายขาย</text>
<text x="48" y="186" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">ที่มา  ชั้นข้อความดิบของ BI ระบบขาย รุ่น 0.9 บรรทัด 41</text>
<text x="48" y="220" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">และชั้นข้อความดิบของ BI ระบบขาย รุ่น 1.0 บรรทัด 44</text>
<text x="48" y="254" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="17" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">wiki ยังไม่มีหน้าเรื่องการอนุมัติใบสั่งขาย</text>
<text x="32" y="302" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">ผู้ช่วย</text>
</svg>

<rect x="16" y="34" width="608" height="34" rx="0" fill="#008271"/>
<text x="24" y="55.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">DEF</text>
<text x="104" y="55.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">เรื่อง</text>
<text x="360" y="55.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">สถานะ</text>
<text x="484" y="55.68" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">ผลทดสอบ</text>
<rect x="16" y="68" width="608" height="34" rx="0" fill="#FFFFFF"/>
<text x="24" y="89.68" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">DEF-52</text>
<text x="104" y="90.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Undo ใบประกอบแล้ว post ใหม่ไม่ได้</text>
<text x="360" y="90.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Closed 09-10</text>
<text x="484" y="90.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">มือ 1 กรณี ผ่าน</text>
<rect x="16" y="102" width="608" height="34" rx="0" fill="#F4F6F6"/>
<text x="24" y="123.68" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">DEF-58</text>
<text x="104" y="124.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">อาการเดียวกับ DEF-52</text>
<text x="360" y="124.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Open 09-22</text>
<text x="484" y="124.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">-</text>
<rect x="16" y="34" width="608" height="102" rx="0" fill="none" stroke="#C5D0CF" stroke-width="1"/>
<rect x="16" y="154" width="608" height="108" rx="8" fill="#F4F6F6"/>
<text x="32" y="179" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">error ที่ผู้ใช้แนบ  Quantity to Assemble เกิน Remaining Quantity</text>
<text x="32" y="209" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">งานแก้ DEF-52  ทดสอบด้วยมือเฉพาะกรณีที่ผู้ใช้แจ้ง</text>

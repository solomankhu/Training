<text x="28" y="27" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="12" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">สรุปผลกระทบยอดเจ้าหนี้  รอบ 1  NSL-01  (ผู้ช่วยรวบรวม 2026-10-20)</text>

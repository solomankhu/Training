<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ภาพบันทึกการอบรมและ UAT รอบ 1 ระบบขายของ GOF-INS 4 แถว วันที่ 2026-11-16 ถึง 2026-11-19</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<text x="16" y="25" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#008271" text-anchor="start" xml:space="preserve" style="white-space:pre">บันทึกการอบรมและ UAT รอบ 1 ระบบขาย  เกรทวัน ฟู้ดส์  GOF-INS</text>
<rect x="16" y="34" width="608" height="36" rx="0" fill="#008271"/>
<text x="24" y="57.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">วันที่</text>
<text x="144" y="57.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">หัวข้อ</text>
<text x="294" y="57.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">ผู้เข้า</text>
<text x="368" y="57.04" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">คำถามและสิ่งที่ผู้ใช้ลองทำ</text>
<rect x="16" y="70" width="608" height="36" rx="0" fill="#FFFFFF"/>
<text x="24" y="93.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">2026-11-16</text>
<text x="144" y="93.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ใบสั่งขาย</text>
<text x="294" y="93.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">6 คน</text>
<text x="368" y="93.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ถามวิธีคัดลอกเอกสาร  ลองแล้วผ่าน</text>
<rect x="16" y="106" width="608" height="36" rx="0" fill="#F4F6F6"/>
<text x="24" y="129.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">2026-11-17</text>
<text x="144" y="129.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ส่วนลดขั้นบันได</text>
<text x="294" y="129.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">5 คน</text>
<text x="368" y="129.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ส่วนลดผิด 1 กรณี</text>
<rect x="16" y="142" width="608" height="36" rx="0" fill="#FFFFFF"/>
<text x="24" y="165.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">2026-11-18</text>
<text x="144" y="165.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ใบแจ้งหนี้</text>
<text x="294" y="165.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">6 คน</text>
<text x="368" y="165.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ไม่มีคำถาม</text>
<rect x="16" y="178" width="608" height="36" rx="0" fill="#F4F6F6"/>
<text x="24" y="201.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">2026-11-19</text>
<text x="144" y="201.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">รับชำระ</text>
<text x="294" y="201.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">4 คน</text>
<text x="368" y="201.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ลองแล้วผ่าน</text>
<rect x="16" y="34" width="608" height="180" rx="0" fill="none" stroke="#C5D0CF" stroke-width="1"/>
<rect x="16" y="220" width="608" height="78" rx="8" fill="#F4F6F6"/>
<text x="32" y="245" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ผู้บันทึก  ผู้สอนของทีมอบรม</text>
<text x="32" y="275" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ไฟล์ผล UAT รอบ 1 แยกต่างหาก  ยังไม่มีในคลังกลาง</text>

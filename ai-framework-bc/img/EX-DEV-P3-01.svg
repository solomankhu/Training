<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>บันทึก defect ของ GOF-INS หลังขึ้นระบบ ระบุวิธีแก้ให้ลบข้อมูลสินค้าที่ไม่คุม Lot ในฐานข้อมูลด้วยคำสั่ง SQL โดยตรง เพื่อไม่ให้แสดงในหน้ารายการที่ปรับแต่งขึ้น</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<text x="16" y="29" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#008271" text-anchor="start" xml:space="preserve" style="white-space:pre">GOF-INS  Defect log</text>
<rect x="16" y="38" width="608" height="30" rx="0" fill="#008271"/>
<text x="24" y="58.4" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" xml:space="preserve" style="white-space:pre">ช่อง</text>

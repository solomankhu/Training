<text x="28" y="250" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ลบข้อมูลสินค้าที่ไม่คุม Lot ในฐานข้อมูลด้วยคำสั่ง SQL</text>

<text x="174" y="178.76" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">In-progress</text>
<rect x="16" y="38" width="608" height="150" rx="0" fill="none" stroke="#C5D0CF" stroke-width="1"/>

<rect x="16" y="68" width="608" height="30" rx="0" fill="#FFFFFF"/>
<text x="24" y="88.76" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">No.</text>
<text x="174" y="88.76" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">DEF-41</text>
<rect x="16" y="98" width="608" height="30" rx="0" fill="#F4F6F6"/>
<text x="24" y="118.76" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Module</text>
<text x="174" y="118.76" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Inventory</text>
<rect x="16" y="128" width="608" height="30" rx="0" fill="#FFFFFF"/>
<text x="24" y="148.76" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">Title</text>
<text x="174" y="148.76" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">หน้ารายการ AMS Lot List แสดงสินค้าที่ไม่คุม Lot</text>
<rect x="16" y="158" width="608" height="30" rx="0" fill="#F4F6F6"/>

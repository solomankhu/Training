<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img">
<title>ภาพแถว DEF-48 ใน defect log ของ NSL-01 UAT รอบ 2 คู่กับภาพหน้าจอที่คุณนิดาแนบ</title>
<rect width="640" height="360" fill="#FFFFFF"/>
<rect x="16" y="10" width="608" height="195" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<path d="M16 18 a8 8 0 0 1 8 -8 h592 a8 8 0 0 1 8 8 v16 h-608 Z" fill="#F4F6F6"/>
<text x="28" y="27" font-family="Consolas, 'Courier New', Prompt, Sarabun, Tahoma, monospace" font-size="13" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">defect log  NSL-01  UAT รอบ 2  DEF-48</text>
<text x="28" y="58" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">เรื่อง  post ใบแจ้งหนี้ลูกค้าขาจรที่ใช้บรรทัดประเภท G/L ไม่ได้</text>
<text x="28" y="89" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ผู้แจ้ง  คุณนิดา     ประเภทที่ผู้ใช้ระบุ  bug ของโปรแกรม</text>
<text x="28" y="120" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">หมายเหตุ  ใบแจ้งหนี้ที่ใช้บรรทัดประเภท Item post ได้ปกติ</text>
<text x="28" y="151" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ผลจำลองปัญหา  (ยังไม่มี)</text>
<text x="28" y="182" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#262626" text-anchor="start" xml:space="preserve" style="white-space:pre">ส่งต่อ  คุณบอส  (รอส่ง)</text>
<rect x="16" y="221" width="608" height="66" rx="8" fill="#FFFFFF" stroke="#C5D0CF" stroke-width="1"/>
<text x="32" y="247" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="14" fill="#6B6B6B" text-anchor="start" xml:space="preserve" style="white-space:pre">ภาพหน้าจอที่คุณนิดาแนบ</text>
<text x="32" y="273" font-family="Prompt, Sarabun, Tahoma, sans-serif" font-size="16" fill="#B42318" text-anchor="start" xml:space="preserve" style="white-space:pre">Error  ระบบไม่ post ใบแจ้งหนี้ เมื่อมีบรรทัดประเภท G/L</text>
</svg>

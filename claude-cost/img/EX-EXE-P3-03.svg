<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>คุณมดเสนอใช้ Agent หลายตัวกับ 2 งาน คือรายงานสถานะประจำสัปดาห์ และงานวิจัยเทียบข้อมูลผู้ขาย 4 รายสำหรับข้อเสนอโครงการมูลค่าสูง</title>
<rect width="640" height="360" rx="18" fill="#F6F9F8"/>
<g font-family="Prompt, 'Noto Sans Thai', Tahoma, sans-serif">
<!-- agent network -->
<g stroke="#D2641A" stroke-width="2.5">
<line x1="380" y1="58" x2="320" y2="40"/><line x1="380" y1="58" x2="440" y2="40"/><line x1="380" y1="58" x2="330" y2="96"/><line x1="380" y1="58" x2="430" y2="96"/>
</g>
<circle cx="380" cy="58" r="16" fill="#D2641A"/>
<g fill="#FFFFFF" stroke="#D2641A" stroke-width="3">
<circle cx="320" cy="40" r="11"/><circle cx="440" cy="40" r="11"/><circle cx="330" cy="96" r="11"/><circle cx="430" cy="96" r="11"/>
</g>
<text x="470" y="64" font-size="17" fill="#14211D">Agent หลายตัว</text>
<g stroke="#46564F" stroke-width="2" stroke-dasharray="5 5" fill="none">
<path d="M352 110L262 150"/><path d="M408 110L498 150"/>
</g>
<!-- Mod -->
<circle cx="70" cy="120" r="24" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>
<rect x="40" y="148" width="60" height="48" rx="20" fill="#D2641A"/>
<rect x="26" y="204" width="88" height="28" rx="14" fill="#14211D"/>
<text x="70" y="224" font-size="16" fill="#FFFFFF" text-anchor="middle">คุณมด</text>
<rect x="132" y="34" width="150" height="52" rx="16" fill="#FFFFFF" stroke="#D2641A" stroke-width="2"/>
<text x="207" y="66" font-size="17" fill="#14211D" text-anchor="middle">ข้อเสนอ 2 งาน</text>
<!-- task 1 -->
<rect x="140" y="152" width="236" height="184" rx="14" fill="#FFFFFF" stroke="#14211D" stroke-width="2"/>
<path d="M140 166a14 14 0 0 1 14-14h208a14 14 0 0 1 14 14v22H140z" fill="#14211D"/>
<text x="258" y="177" font-size="16" fill="#FFFFFF" text-anchor="middle">งานที่ 1</text>
<text x="158" y="216" font-size="17" fill="#14211D">รายงานสถานะ</text>
<text x="158" y="240" font-size="17" fill="#14211D">ประจำสัปดาห์</text>
<rect x="158" y="258" width="200" height="62" rx="10" fill="#FBE7D9"/>
<text x="258" y="284" font-size="15" fill="#46564F" text-anchor="middle">งาน Cowork เดี่ยว</text>
<text x="258" y="306" font-size="15" fill="#46564F" text-anchor="middle">ทำเสร็จได้อยู่แล้ว</text>
<!-- task 2 -->
<rect x="390" y="152" width="226" height="184" rx="14" fill="#FFFFFF" stroke="#14211D" stroke-width="2"/>
<path d="M390 166a14 14 0 0 1 14-14h198a14 14 0 0 1 14 14v22H390z" fill="#14211D"/>
<text x="503" y="177" font-size="16" fill="#FFFFFF" text-anchor="middle">งานที่ 2</text>
<text x="408" y="216" font-size="17" fill="#14211D">วิจัยเทียบข้อมูล</text>
<text x="408" y="240" font-size="17" fill="#14211D">ผู้ขาย 4 ราย</text>
<g fill="#FBE7D9" stroke="#D2641A" stroke-width="1.5">
<rect x="534" y="222" width="16" height="22" rx="4"/><rect x="554" y="222" width="16" height="22" rx="4"/><rect x="574" y="222" width="16" height="22" rx="4"/><rect x="594" y="222" width="16" height="22" rx="4"/>
</g>
<rect x="408" y="258" width="190" height="62" rx="10" fill="#FBE7D9"/>
<text x="503" y="284" font-size="15" fill="#46564F" text-anchor="middle">ข้อเสนอโครงการ</text>
<text x="503" y="306" font-size="15" fill="#46564F" text-anchor="middle">มูลค่าสูง</text>
</g>
</svg>

<path d="M138 214h6a10 10 0 0 1 0 20h-6" stroke="#14211D" stroke-width="3" fill="none"/>
<path d="M96 196c-6-6 6-10 0-18M116 196c-6-6 6-10 0-18" stroke="#7D8F88" stroke-width="2.5" fill="none" stroke-linecap="round"/>

<rect x="230" y="74" width="180" height="262" rx="14" fill="#14211D"/>
<circle cx="248" cy="92" r="4" fill="#B23A2B"/><circle cx="261" cy="92" r="4" fill="#FFB547"/><circle cx="274" cy="92" r="4" fill="#0F8A4F"/>
<g fill="#46564F">
<rect x="248" y="116" width="120" height="7" rx="3.5"/>
<rect x="248" y="132" width="90" height="7" rx="3.5"/>
<rect x="248" y="148" width="136" height="7" rx="3.5"/>
<rect x="248" y="164" width="70" height="7" rx="3.5"/>
</g>
<rect x="248" y="194" width="144" height="40" rx="12" fill="#D2641A"/>
<path d="M260 210h96M260 220h60" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
<text x="320" y="300" font-size="17" fill="#FFFFFF" text-anchor="middle">ส่ง 1 ข้อความ</text>
<!-- chevron -->
<path d="M414 196l10 10l-10 10" stroke="#7D8F88" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

<text x="114" y="322" font-size="15" fill="#46564F" text-anchor="middle">ชงกาแฟ</text>
<!-- chevron -->
<path d="M208 196l10 10l-10 10" stroke="#7D8F88" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

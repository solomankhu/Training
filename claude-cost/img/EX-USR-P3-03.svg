<rect x="456" y="236" width="18" height="24" rx="3"/>
<rect x="482" y="232" width="18" height="28" rx="3"/>
<rect x="508" y="238" width="18" height="22" rx="3"/>
<rect x="534" y="234" width="18" height="26" rx="3"/>

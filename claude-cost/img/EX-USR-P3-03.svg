<rect x="132" y="22" width="484" height="34" rx="17" fill="#FBE7D9" stroke="#D2641A" stroke-width="2"/>
<text x="374" y="45" font-size="16" fill="#14211D" text-anchor="middle">โควตาหมดแล้ว จึงทำงานต่อด้วยเครดิตการใช้งาน</text>
<!-- panel 1 break -->
<rect x="24" y="74" width="180" height="262" rx="14" fill="#FFFFFF" stroke="#46564F" stroke-width="1.5"/>
<circle cx="114" cy="136" r="40" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>

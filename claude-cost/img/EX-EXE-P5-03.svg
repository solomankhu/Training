<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>วันที่ 2 ธันวาคม คุณนิดได้ตัวเลข 2 ชุดเพื่อปิดงบ คือยอดรวมจาก /usage ประมาณ 210 USD และ Spend CSV ที่แสดงยอดคุณมด 52 USD กับเพดาน 50 USD</title>
<rect width="640" height="360" rx="18" fill="#F6F9F8"/>
<g font-family="Prompt, 'Noto Sans Thai', Tahoma, sans-serif">
<rect x="250" y="18" width="140" height="34" rx="17" fill="#C8336C"/>
<text x="320" y="41" font-size="16" fill="#FFFFFF" text-anchor="middle">2 ธันวาคม</text>
<!-- set 1: /usage -->
<rect x="24" y="70" width="222" height="226" rx="12" fill="#14211D"/>
<circle cx="42" cy="88" r="5" fill="#B23A2B"/><circle cx="58" cy="88" r="5" fill="#FFB547"/><circle cx="74" cy="88" r="5" fill="#0F8A4F"/>
<text x="44" y="132" font-size="17" fill="#FFB547">&gt; /usage</text>
<g fill="#46564F"><rect x="44" y="148" width="150" height="8" rx="4"/><rect x="44" y="166" width="118" height="8" rx="4"/><rect x="44" y="184" width="164" height="8" rx="4"/></g>
<text x="44" y="226" font-size="15" fill="#C9D3CF">รวมจากทุกการสนทนา</text>
<text x="44" y="264" font-size="20" fill="#FFFFFF">ประมาณ 210 USD</text>
<text x="135" y="322" font-size="15" fill="#46564F" text-anchor="middle">ชุดที่ 1 คุณมดรวมให้</text>
<!-- set 2: Spend CSV -->
<rect x="394" y="70" width="222" height="226" rx="12" fill="#FFFFFF" stroke="#14211D" stroke-width="2"/>
<path d="M394 82a12 12 0 0 1 12-12h198a12 12 0 0 1 12 12v24H394z" fill="#C8336C"/>
<text x="412" y="94" font-size="16" fill="#FFFFFF">Spend CSV</text>
<text x="412" y="132" font-size="15" fill="#46564F">ผู้ใช้</text>
<text x="598" y="132" font-size="15" fill="#46564F" text-anchor="end">USD</text>
<line x1="408" y1="142" x2="602" y2="142" stroke="#C9D3CF" stroke-width="1.5"/>
<rect x="404" y="148" width="202" height="34" rx="6" fill="#F8E1EA"/>
<text x="412" y="171" font-size="17" fill="#14211D">คุณมด</text>
<text x="598" y="171" font-size="17" fill="#14211D" text-anchor="end">52</text>
<g fill="#E3E9E6"><rect x="412" y="196" width="80" height="8" rx="4"/><rect x="570" y="196" width="28" height="8" rx="4"/><rect x="412" y="216" width="64" height="8" rx="4"/><rect x="570" y="216" width="28" height="8" rx="4"/></g>
<line x1="408" y1="238" x2="602" y2="238" stroke="#C9D3CF" stroke-width="1.5"/>
<text x="412" y="270" font-size="15" fill="#46564F">เพดานของคุณมด</text>
<text x="598" y="270" font-size="15" fill="#14211D" text-anchor="end">50 USD</text>
<text x="505" y="322" font-size="15" fill="#46564F" text-anchor="middle">ชุดที่ 2 คุณเอกส่งออก</text>
<!-- Nid -->
<rect x="282" y="76" width="76" height="52" rx="18" fill="#FFFFFF" stroke="#C8336C" stroke-width="2"/>
<text x="320" y="112" font-size="26" fill="#C8336C" text-anchor="middle">?</text>
<path d="M312 127l8 14 8-14z" fill="#FFFFFF" stroke="#C8336C" stroke-width="2" stroke-linejoin="round"/>
<rect x="310" y="122" width="20" height="7" fill="#FFFFFF"/>
<circle cx="320" cy="176" r="26" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>
<rect x="288" y="206" width="64" height="54" rx="22" fill="#C8336C"/>
<rect x="276" y="268" width="88" height="28" rx="14" fill="#14211D"/>
<text x="320" y="288" font-size="16" fill="#FFFFFF" text-anchor="middle">คุณนิด</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>วันที่ 3 ธันวาคม คุณภพต้องรายงานที่ประชุมผู้บริหาร และได้รับข้อความจากคุณฝนที่ขอเพิ่มเพดานจาก 50 USD เป็น 100 USD โดยไม่มีไฟล์แนบ</title>
<rect width="640" height="360" rx="18" fill="#F6F9F8"/>
<g font-family="Prompt, 'Noto Sans Thai', Tahoma, sans-serif">
<!-- chat from Fon -->
<rect x="24" y="24" width="276" height="312" rx="16" fill="#FFFFFF" stroke="#14211D" stroke-width="2"/>
<path d="M24 40a16 16 0 0 1 16-16h244a16 16 0 0 1 16 16v32H24z" fill="#C8336C"/>
<circle cx="50" cy="48" r="12" fill="#FFFFFF"/>
<text x="72" y="54" font-size="16" fill="#FFFFFF">คุณฝน</text>
<text x="284" y="54" font-size="15" fill="#FFFFFF" text-anchor="end">ถึงคุณภพ</text>
<rect x="40" y="90" width="150" height="40" rx="16" fill="#F8E1EA"/>
<text x="56" y="116" font-size="16" fill="#14211D">เครดิตไม่พอใช้</text>
<rect x="40" y="142" width="244" height="66" rx="16" fill="#F8E1EA"/>
<text x="56" y="168" font-size="16" fill="#14211D">ขอเพิ่มเพดานรายบุคคล</text>
<text x="56" y="194" font-size="16" fill="#14211D">จาก 50 USD เป็น 100 USD</text>
<rect x="40" y="226" width="244" height="40" rx="12" fill="#FFFFFF" stroke="#C9D3CF" stroke-width="1.5" stroke-dasharray="5 4"/>
<path d="M62 252v-12a6 6 0 0 1 12 0v14a9 9 0 0 1-18 0v-10" fill="none" stroke="#9FB0A8" stroke-width="2.2" stroke-linecap="round"/>
<text x="88" y="252" font-size="15" fill="#9FB0A8">ไม่มีไฟล์แนบ</text>
<rect x="40" y="282" width="244" height="36" rx="18" fill="#EEF2F0"/>
<!-- meeting -->
<rect x="320" y="24" width="296" height="166" rx="14" fill="#FFFFFF" stroke="#46564F" stroke-width="1.5"/>
<rect x="336" y="40" width="54" height="58" rx="10" fill="#FFFFFF" stroke="#C8336C" stroke-width="2"/>
<path d="M336 50a10 10 0 0 1 10-10h34a10 10 0 0 1 10 10v8h-54z" fill="#C8336C"/>
<text x="363" y="90" font-size="20" fill="#14211D" text-anchor="middle">3</text>
<text x="404" y="64" font-size="17" fill="#14211D">ประชุมผู้บริหาร</text>
<text x="404" y="88" font-size="15" fill="#46564F">3 ธันวาคม</text>
<line x1="336" y1="112" x2="600" y2="112" stroke="#E3E9E6" stroke-width="1.5"/>
<circle cx="344" cy="134" r="4" fill="#C8336C"/>
<text x="356" y="140" font-size="15" fill="#14211D">ค่าใช้จ่ายเครดิตเดือนพฤศจิกายน</text>
<circle cx="344" cy="166" r="4" fill="#C8336C"/>
<text x="356" y="172" font-size="15" fill="#14211D">เพดานของเดือนธันวาคม</text>
<!-- Phop and Ek -->
<circle cx="390" cy="238" r="22" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>
<rect x="362" y="264" width="56" height="38" rx="18" fill="#C8336C"/>
<rect x="346" y="308" width="88" height="28" rx="14" fill="#14211D"/>
<text x="390" y="328" font-size="16" fill="#FFFFFF" text-anchor="middle">คุณภพ</text>
<circle cx="530" cy="238" r="22" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>
<rect x="502" y="264" width="56" height="38" rx="18" fill="#46564F"/>
<rect x="486" y="308" width="88" height="28" rx="14" fill="#14211D"/>
<text x="530" y="328" font-size="16" fill="#FFFFFF" text-anchor="middle">คุณเอก</text>
<rect x="560" y="210" width="60" height="26" rx="13" fill="#FFB547"/>
<text x="590" y="228" font-size="15" fill="#14211D" text-anchor="middle">Owner</text>
</g>

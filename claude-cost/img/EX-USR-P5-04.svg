<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>เวลา 17.00 น. หน้า Settings &gt; Usage ของคุณฝนแสดงว่าโควตารายสัปดาห์ลดลงมากผิดปกติ ทั้งที่ปริมาณงานใกล้เคียงทุกวัน คุณฝนจึงเริ่มเขียนข้อความถึงคุณเอกซึ่งเป็น Owner</title>
<rect width="640" height="360" rx="18" fill="#F6F9F8"/>
<g font-family="Prompt, 'Noto Sans Thai', Tahoma, sans-serif">
<!-- time -->
<rect x="24" y="24" width="132" height="40" rx="20" fill="#C8336C"/>
<circle cx="48" cy="44" r="11" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
<path d="M48 37v7h-6" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<text x="66" y="50" font-size="16" fill="#FFFFFF">17.00 น.</text>
<!-- usage card -->
<rect x="24" y="80" width="240" height="160" rx="14" fill="#FFFFFF" stroke="#14211D" stroke-width="2"/>
<path d="M24 94a14 14 0 0 1 14-14h212a14 14 0 0 1 14 14v18H24z" fill="#14211D"/>
<text x="40" y="104" font-size="15" fill="#FFFFFF">Settings &gt; Usage</text>
<text x="40" y="142" font-size="15" fill="#14211D">โควตารายสัปดาห์</text>
<rect x="40" y="154" width="208" height="18" rx="9" fill="#EEF2F0"/>
<rect x="40" y="154" width="190" height="18" rx="9" fill="#C8336C"/>
<text x="40" y="198" font-size="16" fill="#B23A2B">ลดลงมากผิดปกติ</text>
<path d="M40 222c6-8 18-8 24 0c-6 8-18 8-24 0z" fill="none" stroke="#46564F" stroke-width="2"/>
<circle cx="52" cy="222" r="3.5" fill="#46564F"/>
<text x="72" y="227" font-size="15" fill="#46564F">เห็นเฉพาะของตนเอง</text>
<!-- workload -->
<rect x="282" y="80" width="150" height="160" rx="14" fill="#FFFFFF" stroke="#46564F" stroke-width="1.5"/>
<text x="357" y="106" font-size="15" fill="#14211D" text-anchor="middle">ปริมาณงาน</text>
<path d="M298 200h118" stroke="#46564F" stroke-width="2"/>
<rect x="308" y="126" width="38" height="74" rx="5" fill="#C9D3CF"/>
<rect x="368" y="126" width="38" height="74" rx="5" fill="#C8336C"/>
<text x="327" y="224" font-size="15" fill="#46564F" text-anchor="middle">ทุกวัน</text>
<text x="387" y="224" font-size="15" fill="#14211D" text-anchor="middle">วันนี้</text>
<!-- owner -->
<rect x="450" y="80" width="166" height="160" rx="14" fill="#F9E1EA" stroke="#C8336C" stroke-width="2"/>
<circle cx="533" cy="118" r="20" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>
<rect x="507" y="142" width="52" height="34" rx="14" fill="#14211D"/>
<rect x="499" y="148" width="68" height="24" rx="12" fill="#C8336C"/>
<text x="533" y="166" font-size="15" fill="#FFFFFF" text-anchor="middle">Owner</text>
<text x="533" y="214" font-size="17" fill="#14211D" text-anchor="middle">คุณเอก</text>
<!-- fon -->
<circle cx="50" cy="274" r="16" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>
<rect x="30" y="294" width="40" height="42" rx="14" fill="#C8336C"/>
<rect x="80" y="262" width="84" height="30" rx="15" fill="#14211D"/>
<text x="122" y="283" font-size="15" fill="#FFFFFF" text-anchor="middle">คุณฝน</text>
<!-- draft message -->
<rect x="180" y="256" width="436" height="80" rx="14" fill="#FFFFFF" stroke="#C8336C" stroke-width="2"/>
<text x="198" y="282" font-size="15" fill="#C8336C">ข้อความถึงคุณเอก</text>
<path d="M198 302h300M198 320h200" stroke="#C9D3CF" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>
<rect x="410" y="310" width="3" height="20" fill="#14211D"/>
</g>
</svg>

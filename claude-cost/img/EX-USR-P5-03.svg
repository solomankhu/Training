<text x="556" y="49" font-size="15" fill="#14211D" text-anchor="middle">ครั้งแรก</text>
<text x="270" y="92" font-size="16" fill="#14211D">งานสุดท้ายของวัน</text>
<!-- sources -->
<rect x="270" y="108" width="122" height="72" rx="12" fill="#F9E1EA"/>
<rect x="315" y="118" width="32" height="22" rx="3" fill="#FFFFFF" stroke="#C8336C" stroke-width="2"/>
<path d="M315 120l16 11l16-11" stroke="#C8336C" stroke-width="2" fill="none" stroke-linejoin="round"/>
<text x="331" y="166" font-size="15" fill="#14211D" text-anchor="middle">อีเมลลูกค้า</text>
<rect x="270" y="192" width="122" height="72" rx="12" fill="#F9E1EA"/>
<path d="M323 202h16l10 17h-16zM323 202l-10 17l8 13l10-17zM321 232h28l-8-13h-28z" fill="#FFFFFF" stroke="#C8336C" stroke-width="2" stroke-linejoin="round"/>
<text x="331" y="252" font-size="15" fill="#14211D" text-anchor="middle" dy="2">Drive</text>
<g stroke="#7D8F88" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M398 144h12l6 42M398 228h12l6-42"/>
</g>
<!-- table -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>เวลา 16.00 น. โควตารอบ 5 ชั่วโมงของคุณฝนเหลือไม่มาก และงานสุดท้ายคือให้ Cowork ดึงข้อมูลจากอีเมลลูกค้าและ Drive มาทำตารางเปรียบเทียบข้อเสนอ 3 รายแบบสั้น 1 หน้า ซึ่งคุณฝนไม่เคยสั่งงานแบบนี้มาก่อน</title>
<rect width="640" height="360" rx="18" fill="#F6F9F8"/>
<g font-family="Prompt, 'Noto Sans Thai', Tahoma, sans-serif">
<!-- time -->
<rect x="24" y="24" width="132" height="40" rx="20" fill="#C8336C"/>
<circle cx="48" cy="44" r="11" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
<path d="M48 37v7h-6" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
<text x="66" y="50" font-size="16" fill="#FFFFFF">16.00 น.</text>
<!-- usage -->
<rect x="24" y="80" width="210" height="150" rx="14" fill="#FFFFFF" stroke="#14211D" stroke-width="2"/>
<path d="M24 94a14 14 0 0 1 14-14h182a14 14 0 0 1 14 14v18H24z" fill="#14211D"/>
<text x="40" y="104" font-size="15" fill="#FFFFFF">Settings &gt; Usage</text>
<text x="40" y="144" font-size="15" fill="#14211D">โควตารอบ 5 ชั่วโมง</text>
<rect x="40" y="158" width="178" height="18" rx="9" fill="#EEF2F0"/>
<rect x="40" y="158" width="162" height="18" rx="9" fill="#C8336C"/>
<text x="218" y="212" font-size="16" fill="#B23A2B" text-anchor="end">เหลือไม่มาก</text>
<!-- character -->
<circle cx="64" cy="266" r="18" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>
<rect x="40" y="288" width="48" height="48" rx="16" fill="#C8336C"/>
<rect x="102" y="270" width="110" height="32" rx="16" fill="#14211D"/>
<text x="157" y="292" font-size="16" fill="#FFFFFF" text-anchor="middle">คุณฝน</text>
<!-- cowork window -->
<rect x="254" y="24" width="362" height="312" rx="14" fill="#FFFFFF" stroke="#14211D" stroke-width="2"/>
<path d="M254 38a14 14 0 0 1 14-14h334a14 14 0 0 1 14 14v26H254z" fill="#C8336C"/>
<text x="270" y="50" font-size="16" fill="#FFFFFF">Cowork</text>

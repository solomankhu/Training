<text x="510" y="132" font-size="15" fill="#14211D" text-anchor="middle">ตารางเปรียบเทียบ</text>
<rect x="436" y="144" width="148" height="20" fill="#C8336C"/>
<g stroke="#C9D3CF" stroke-width="1.5">
<path d="M436 184h148M436 204h148M436 224h148"/>
<path d="M485 144v80M535 144v80"/>
</g>
<path d="M485 144v20M535 144v20" stroke="#FFFFFF" stroke-width="1.5"/>
<text x="510" y="252" font-size="15" fill="#46564F" text-anchor="middle">ข้อเสนอ 3 ราย</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>ยอดเครดิตการใช้งานเดือนนี้สูงเป็น 2 เท่าของเดือนก่อน และคุณภพให้หาสาเหตุ</title>
<rect width="640" height="360" rx="18" fill="#F6F9F8"/>
<g font-family="Prompt, 'Noto Sans Thai', Tahoma, sans-serif">
<!-- chart card -->
<rect x="24" y="24" width="360" height="312" rx="14" fill="#FFFFFF" stroke="#14211D" stroke-width="2"/>
<text x="44" y="60" font-size="18" fill="#14211D">ยอดเครดิตการใช้งาน</text>
<line x1="60" y1="290" x2="356" y2="290" stroke="#46564F" stroke-width="2"/>
<g stroke="#E3E9E6" stroke-width="1.5"><line x1="60" y1="240" x2="356" y2="240"/><line x1="60" y1="190" x2="356" y2="190"/><line x1="60" y1="140" x2="356" y2="140"/><line x1="60" y1="90" x2="356" y2="90"/></g>
<rect x="96" y="190" width="80" height="100" rx="8" fill="#C9D3CF"/>
<rect x="232" y="90" width="80" height="200" rx="8" fill="#D2641A"/>
<text x="136" y="318" font-size="16" fill="#46564F" text-anchor="middle">เดือนก่อน</text>
<text x="272" y="318" font-size="16" fill="#14211D" text-anchor="middle">เดือนนี้</text>
<path d="M190 190h14v-100h14" stroke="#14211D" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
<rect x="150" y="122" width="74" height="32" rx="16" fill="#14211D"/>
<text x="187" y="144" font-size="17" fill="#FFFFFF" text-anchor="middle">2 เท่า</text>
<!-- Phop -->
<circle cx="510" cy="196" r="28" fill="#FFFFFF" stroke="#14211D" stroke-width="3"/>
<rect x="476" y="228" width="68" height="58" rx="24" fill="#D2641A"/>
<rect x="462" y="296" width="96" height="30" rx="15" fill="#14211D"/>
<text x="510" y="317" font-size="17" fill="#FFFFFF" text-anchor="middle">คุณภพ</text>
<rect x="408" y="36" width="208" height="66" rx="18" fill="#FFFFFF" stroke="#D2641A" stroke-width="2"/>
<path d="M490 101l14 22 8-22z" fill="#FFFFFF" stroke="#D2641A" stroke-width="2" stroke-linejoin="round"/>
<rect x="488" y="96" width="26" height="8" fill="#FFFFFF"/>
<text x="512" y="76" font-size="17" fill="#14211D" text-anchor="middle">ขอให้หาสาเหตุ</text>
<!-- magnifier -->
<circle cx="586" cy="168" r="18" fill="#FBE7D9" stroke="#14211D" stroke-width="3"/>
<line x1="599" y1="181" x2="612" y2="196" stroke="#14211D" stroke-width="5" stroke-linecap="round"/>
<text x="586" y="175" font-size="18" fill="#D2641A" text-anchor="middle">?</text>
</g>
</svg>

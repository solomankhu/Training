<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แบบทดสอบหลังอบรม Claude Token และต้นทุน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F4F6F6; --surface:#FFFFFF; --surface-2:#F7F9F9;
  --ink:#16221C; --ink-2:#4C5C53; --ink-3:#7E8D84;
  --line:#DCE3D9; --line-2:#C6D0C2;
  --accent:#008271; --accent-ink:#FFFFFF; --accent-soft:#DDF3EF;
  --amber:#A96C16; --amber-soft:#FAEFDD;
  --bad:#A33A2C; --bad-soft:#F9E5E2;
  --shadow:0 1px 2px rgba(22,34,28,.06), 0 8px 24px rgba(22,34,28,.05);
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0E1410; --surface:#19211B; --surface-2:#202A22;
    --ink:#E7EDE6; --ink-2:#A8B4AB; --ink-3:#7B8880;
    --line:#2A352C; --line-2:#3A473C;
    --accent:#30E5D0; --accent-ink:#0E1410; --accent-soft:#123A35;
    --amber:#D89C46; --amber-soft:#33270F;
    --bad:#E07866; --bad-soft:#3A1E19;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{
  height:100%; margin:0; background:var(--ground); color:var(--ink);
  font-family:"Prompt","Noto Sans Thai",system-ui,sans-serif;
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
img{max-width:100%}
[hidden]{display:none!important}

#shell{height:100%;max-width:520px;margin:0 auto;background:var(--surface);
  display:flex;flex-direction:column;box-shadow:var(--shadow)}
.bar{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line)}
.scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:20px 16px 28px}
.foot{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;align-items:center}

.demo-strip{background:var(--amber-soft);color:var(--amber);font-size:11.5px;letter-spacing:.02em;
  font-weight:600;padding:7px 16px;text-align:center;border-bottom:1px solid var(--line)}

.prog-wrap{padding:11px 16px 12px;display:flex;flex-direction:column;gap:8px}
.prog-meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.prog-count{font-size:12.5px;color:var(--ink-2);font-weight:500}
.chip{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.track{height:5px;border-radius:999px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:999px;transition:width .32s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

h1{font-size:23px;line-height:1.35;margin:0;font-weight:700;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;line-height:1.45;margin:0;font-weight:600}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:0}
.lede{color:var(--ink-2);margin:0;font-size:14px}
.tiny{font-size:12px;color:var(--ink-3);margin:0;line-height:1.55}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:9px}
hr.rule{border:0;border-top:1px solid var(--line);margin:2px 0}

.hero{display:flex;justify-content:center;padding:4px 0 2px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select{font:inherit;font-size:16px;padding:11px 12px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);width:100%}
.field input::placeholder{color:var(--ink-3)}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.fact{flex:1 1 30%;min-width:96px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:10px 11px}
.fact b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.fact span{font-size:11.5px;color:var(--ink-3)}

.stem{font-size:17px;line-height:1.55;font-weight:600;margin:0}
.hint{font-size:12.5px;color:var(--ink-3);margin:0}
.opts{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--surface-2);cursor:pointer;text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.box{flex:0 0 auto;width:21px;height:21px;border-radius:6px;border:2px solid var(--line-2);
  background:var(--surface);margin-top:1px;display:grid;place-items:center}
.box.round{border-radius:50%}
.opt[aria-checked="true"] .box{border-color:var(--accent);background:var(--accent)}
.box svg{opacity:0;width:13px;height:13px}
.opt[aria-checked="true"] .box svg{opacity:1}
.opt-text{flex:1;font-size:14.5px;line-height:1.5}
.opt-ico{flex:0 0 auto;display:grid;place-items:center;width:26px;height:26px}

.ord{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;position:relative}
.ord li{display:flex;align-items:stretch;gap:9px;padding:9px 9px 9px 12px;border-radius:11px;
  border:1px solid var(--line-2);background:var(--surface-2);position:relative}
.ord li.dragging{z-index:5;border-color:var(--accent);background:var(--surface);
  box-shadow:0 6px 18px rgba(22,34,28,.16);pointer-events:none;user-select:none}
.rank{flex:0 0 auto;width:23px;height:23px;align-self:center;border-radius:7px;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-size:12.5px;font-weight:600}
.ord-text{flex:1;font-size:14.5px;line-height:1.48;align-self:center}
.nudge{display:flex;flex-direction:column;gap:3px;flex:0 0 auto}
.nudge button{width:36px;height:29px;border-radius:8px;border:1px solid var(--line-2);
  background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.nudge button:disabled{opacity:.34;cursor:not-allowed}
.grip{flex:0 0 auto;width:32px;border-radius:9px;border:1px solid var(--line-2);
  background:var(--surface);display:grid;place-items:center;padding:0;
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.grip:active{cursor:grabbing;background:var(--accent-soft);border-color:var(--accent)}

.case{position:sticky;top:0;z-index:2;background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:5px}
.case .eyebrow{color:var(--accent)}
.case p{margin:0;font-size:14px;line-height:1.55;color:var(--ink)}

.btn{flex:1;padding:13px 16px;border-radius:11px;border:1px solid transparent;
  background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:var(--surface);border-color:var(--line-2);color:var(--ink-2);flex:0 0 auto}
.btn.wide{flex:1}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:0;padding:0;list-style:none}
.cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;width:100%}
.cell b{font-size:15px;font-weight:600}
.cell.done{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cell.todo{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.tally{display:flex;gap:8px}
.tally div{flex:1;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.tally .ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.tally .no{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.tally b{display:block;font-size:19px;font-weight:600}
.tally span{font-size:11.5px}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rv{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden}
.rv summary{display:flex;gap:10px;align-items:flex-start;padding:12px;cursor:pointer;list-style:none}
.rv summary::-webkit-details-marker{display:none}
.rv summary svg{flex:none;margin-top:1px}
.rv-q{flex:1;font-size:13.5px;line-height:1.55}
.rv-body{padding:0 14px 14px 44px;font-size:13.5px}
.rv-h{margin:10px 0 4px;font-size:12px;font-weight:600;color:var(--ink-3)}
.rv-list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.rv-why{margin:0;color:var(--ink-2);line-height:1.6;white-space:pre-line}
.score-card{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;
  padding:16px 15px;display:flex;flex-direction:column;align-items:center;gap:3px}
.kv{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.kv span{font-size:13px;color:var(--ink-3)}
.kv b{font-size:13.5px;font-weight:600;text-align:right}
.saved{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.errbox{background:var(--bad-soft);border:1px solid var(--bad);border-radius:12px;padding:13px 14px}
.errbox .eyebrow{color:var(--bad)}
.errbox p{margin:6px 0 0;font-size:13.5px;line-height:1.55;color:var(--ink-2)}
</style>
</head>
<body>

<div id="shell">
  <div class="demo-strip" id="strip" hidden></div>
  <div class="bar" id="topbar" hidden>
    <div class="prog-wrap">
      <div class="prog-meta">
        <span class="prog-count mono" id="pcount"></span>
        <span class="chip" id="pchip"></span>
      </div>
      <div class="track"><div class="fill" id="pfill"></div></div>
    </div>
  </div>
  <div class="scroll" id="scroll"><div class="pad" id="view"></div></div>
  <div class="foot" id="foot" hidden></div>
</div>

<script src="items.js"></script>

<script>
/* ────────────────────────────────────────────────────────────────────────
   ตั้งค่าเพียงบรรทัดเดียว: URL ของ Apps Script ที่ deploy แล้ว (ขั้นที่ 5 ใน README)
   ──────────────────────────────────────────────────────────────────────── */
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbz4MbK-3p7QLB98ltAcIio9tyjoPtwnvE9BKvR13p2Qembk8dn5-IJ0Wg408qGxSh-v/exec';

var ROLES = {
  exec:  { th: 'ผู้บริหาร',          track: 'office' },
  admin: { th: 'Owner และทีม IT',    track: 'office' },
  user:  { th: 'ผู้ใช้งาน',           track: 'office' }
};

/* ค่าจาก QR อ่านจาก URL ของหน้านี้ แล้วกรองแบบเดียวกับที่ doGet เคยกรอง
   -- role ต้องอยู่ใน whitelist, session เหลือเฉพาะ A-Za-z0-9_- */
/* หน่วยงานในแบบฟอร์มลงทะเบียน -- แก้รายการนี้ให้ตรงกับโครงสร้างจริงของบริษัท */
var DEPARTMENTS = ['BDG','S&M','Admin','Consulting','Development','IT','ผู้บริหาร','อื่น ๆ'];

var QR = (function () {
  var p = new URLSearchParams(location.search);
  var r = String(p.get('role') || '');
  return {
    role: Object.prototype.hasOwnProperty.call(ROLES, r) ? r : '',
    session: String(p.get('session') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40)
  };
})();

var PARTS = {
  1:'หมวด 1  ความรู้และการใช้งาน',
  2:'หมวด 2  ขั้นตอนที่ถูกต้อง',
  3:'หมวด 3  การแก้ปัญหา',
  4:'หมวด 4  การรายงานและขอความช่วยเหลือ',
  5:'หมวด 5  สถานการณ์รวม'
};

var ICONS = {
  ok:  '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" fill="var(--accent-soft)"/><path d="M8 12.4l2.6 2.6L16 9.6"/></svg>',
  wait:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--amber)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" fill="var(--amber-soft)"/><path d="M15.5 10.5a4 4 0 10-.3 3.4"/><path d="M15.9 7.6v3h-3"/></svg>',
  fail:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--bad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" fill="var(--bad-soft)"/><path d="M9.3 9.3l5.4 5.4M14.7 9.3l-5.4 5.4"/></svg>',
  none:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="var(--ink-3)" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7"/></svg>'
};
var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-ink)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
var TICK  = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
var UP    = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--ink-2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 12l6-6 6 6"/></svg>';
var DOWN  = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--ink-2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M18 12l-6 6-6-6"/></svg>';
var GRIP  = '<svg viewBox="0 0 16 22" width="16" height="22" fill="var(--ink-3)" aria-hidden="true"><circle cx="5" cy="5" r="1.7"/><circle cx="11" cy="5" r="1.7"/><circle cx="5" cy="11" r="1.7"/><circle cx="11" cy="11" r="1.7"/><circle cx="5" cy="17" r="1.7"/><circle cx="11" cy="17" r="1.7"/></svg>';

/* ============================ สถานะ ============================ */
var DRAFT_KEY = 'amco-claude-cost-exam-v1';
var state = {
  screen:'register', idx:0,
  role: ROLES[QR.role] ? QR.role : null,
  roleFromQR: !!ROLES[QR.role],
  session: QR.session || 'AMCO-DEFAULT',
  track: ROLES[QR.role] ? ROLES[QR.role].track : 'field',
  clientToken: null,
  profile:{name:'', dept:''},
  answers:{}, order:{}, startedAt:null, receipt:null, sendError:null
};
function ITEMS(){ return (state.role && ITEMS_BY_ROLE[state.role]) || []; }
function roleTh(){ return state.role ? ROLES[state.role].th : '—'; }
function uuid(){
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8);
    return v.toString(16);
  });
}
function save(){ try{ localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    var raw = localStorage.getItem(DRAFT_KEY); if(!raw) return false;
    var d = JSON.parse(raw);
    if(!d || d.screen==='register' || d.screen==='submitted') return false;
    for(var k in d){ state[k]=d[k]; }
    return true;
  }catch(e){ return false; }
}
function hasDraft(){
  try{
    var raw = localStorage.getItem(DRAFT_KEY); if(!raw) return false;
    var d = JSON.parse(raw);
    return !!d && d.screen!=='register' && d.screen!=='submitted';
  }catch(e){ return false; }
}
function clearDraft(){ try{ localStorage.removeItem(DRAFT_KEY); }catch(e){} }

function orderItems(it){ return it.type==='ordering' ? it.items : null; }
function initOrder(it){
  if(!state.order[it.id]){
    var n = orderItems(it).length, seq = [];
    for(var i=0;i<n;i++) seq.push(i);
    for(var j=n-1;j>0;j--){ var m=(j*7+3)%(j+1), t=seq[j]; seq[j]=seq[m]; seq[m]=t; }
    state.order[it.id] = seq;
  }
  return state.order[it.id];
}
function answered(it){
  if(it.type==='ordering') return !!state.order[it.id];
  var a = state.answers[it.id];
  return !!a && a.length>0;
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ============================ การวาดหน้าจอ ============================ */
var view=document.getElementById('view'), foot=document.getElementById('foot'),
    topbar=document.getElementById('topbar'), scroll=document.getElementById('scroll');

function render(){
  var q = state.screen==='question';
  topbar.hidden = !q;
  if(q){
    var it = ITEMS()[state.idx];
    document.getElementById('pcount').textContent = 'ข้อ '+(state.idx+1)+' จาก '+ITEMS().length;
    document.getElementById('pchip').textContent = PARTS[it.part] || '';
    document.getElementById('pfill').style.width = ((state.idx+1)/ITEMS().length*100)+'%';
  }
  ({register:vRegister, question:vQuestion, review:vReview, confirm:vConfirm,
    sending:vSending, submitted:vSubmitted, failed:vFailed})[state.screen]();
  scroll.scrollTop = 0;
}

function vRegister(){
  var zones = DEPARTMENTS;
  var roleBlock = state.roleFromQR
    ? '<div class="field"><label>บทบาท</label>'
      + '<div style="display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:9px;border:1px solid var(--accent);background:var(--accent-soft)">'
      + '<span style="font-size:15px;font-weight:600;color:var(--accent)">'+esc(roleTh())+'</span>'
      + '<span class="chip" style="margin-left:auto">หลังอบรม</span></div>'
      + '<p class="tiny">มาจาก QR ที่สแกน รุ่น <b>'+esc(state.session)+'</b></p></div>'
    : '<div class="field"><label for="f-role">บทบาท</label><select id="f-role">'
      + '<option value="">เลือกบทบาท</option>'
      + Object.keys(ROLES).map(function(k){
          return '<option value="'+k+'"'+(state.role===k?' selected':'')+'>'+ROLES[k].th
               + '</option>'; }).join('')
      + '</select><p class="tiny">ปกติบทบาทมาจาก QR — ที่นี่ไม่ได้รับค่ามา จึงต้องเลือกเอง</p></div>';

  view.innerHTML =
    '<div class="stack">'
    + '<div class="hero"><svg viewBox="0 0 230 116" width="216" height="109" role="img" aria-label="ภาพประกอบแชตกับเหรียญโทเคนและมาตรวัดโควตา">'
      + '<rect x="1" y="8" width="228" height="107" rx="12" fill="var(--accent-soft)"/>'
      + '<path d="M22 26h96a10 10 0 0110 10v34a10 10 0 01-10 10H58l-16 14v-14H22a10 10 0 01-10-10V36a10 10 0 0110-10z" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.2"/>'
      + '<g stroke="var(--accent)" stroke-width="3" stroke-linecap="round" opacity=".55"><path d="M30 44h70M30 54h52M30 64h62"/></g>'
      + '<g><circle cx="150" cy="40" r="13" fill="var(--amber)"/><circle cx="168" cy="58" r="13" fill="var(--amber)" opacity=".85"/><circle cx="146" cy="72" r="13" fill="var(--amber)" opacity=".7"/>'
      + '<g fill="var(--surface)" font-family="IBM Plex Mono,monospace" font-size="11" font-weight="700" text-anchor="middle"><text x="150" y="44">T</text><text x="168" y="62">T</text><text x="146" y="76">T</text></g></g>'
      + '<path d="M182 100a26 26 0 0152 0" transform="translate(-12 0)" fill="none" stroke="var(--line-2)" stroke-width="7" stroke-linecap="round"/>'
      + '<path d="M170 100a26 26 0 0139-22" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"/>'

var drag = null;
function commitOrder(it){
  var list = view.querySelector('.ord'); if(!list) return;
  var rows = Array.prototype.slice.call(list.children);
  state.order[it.id] = rows.map(function(li){ return +li.dataset.v; });
  save();
  rows.forEach(function(li,i){
    li.querySelector('.rank').textContent = i+1;
    li.querySelector('[data-mv="up"]').disabled   = i===0;
    li.querySelector('[data-mv="down"]').disabled = i===rows.length-1;
  });
}
function wireOrdering(it){
  var list = view.querySelector('.ord'); if(!list) return;
  Array.prototype.forEach.call(list.querySelectorAll('[data-mv]'), function(b){
    b.onclick = function(){
      var li = b.parentNode.parentNode;
      if(b.dataset.mv==='up'){ var p=li.previousElementSibling; if(p) list.insertBefore(li,p); }
      else { var n=li.nextElementSibling; if(n) list.insertBefore(n,li); }
      commitOrder(it);
      if(!b.disabled) b.focus();
    };
  });
  Array.prototype.forEach.call(list.querySelectorAll('.grip'), function(g){
    g.onpointerdown = function(e){
      if(e.button && e.button!==0) return;
      e.preventDefault();
      drag = { li:g.parentNode, list:list, it:it, y:e.clientY, id:e.pointerId };
      drag.li.classList.add('dragging');
    };
  });
}
window.addEventListener('pointermove', function(e){
  if(!drag || e.pointerId!==drag.id) return;
  e.preventDefault();
  drag.li.style.transform = 'translateY('+(e.clientY-drag.y)+'px)';
  var el = document.elementFromPoint(e.clientX, e.clientY);
  var row = el && el.closest ? el.closest('.ord > li') : null;
  if(row && row!==drag.li && drag.list.contains(row)){
    var r = row.getBoundingClientRect();
    drag.list.insertBefore(drag.li, (e.clientY < r.top + r.height/2) ? row : row.nextSibling);
    drag.y = e.clientY;
    drag.li.style.transform = 'translateY(0)';
  }
}, {passive:false});
function endDrag(){
  if(!drag) return;
  drag.li.classList.remove('dragging');
  drag.li.style.transform = '';
  var it = drag.it; drag = null;
  commitOrder(it);
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* ---- ส่งคำตอบ พร้อม retry แบบถอยหลังเพิ่มทีละเท่าตัว ---- */
function payload(){
  return {
    clientToken: state.clientToken,
    role: state.role, session: state.session, track: state.track,
    name: state.profile.name, department: state.profile.dept,
    startedAt: state.startedAt, submittedAt: Date.now(),
    responses: (function(){
      var r = {};
      ITEMS().forEach(function(it){
        r[it.id] = it.type==='ordering' ? (state.order[it.id]||[]) : (state.answers[it.id]||[]);
      });
      return r;
    })()
  };
}
function submit(attempt){
  state.screen='sending'; state.sendAttempt=attempt; render();

  // ห้ามตั้ง Content-Type เอง -- การตั้งจะทำให้เบราว์เซอร์ยิง preflight OPTIONS ก่อน
  // ซึ่ง Apps Script ตอบไม่ได้ คำขอจะถูกบล็อกทั้งที่ฝั่งเซิร์ฟเวอร์ไม่มีอะไรผิด
  // ปล่อยให้ body เป็นสตริง แล้วเบราว์เซอร์จะใช้ text/plain ซึ่งเป็น simple request
  fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload()) })
    .then(function(r){
      if(!r.ok) throw new Error('เซิร์ฟเวอร์ตอบ ' + r.status);
      return r.json();
    })
    .then(function(res){
      if(!res || !res.ok) throw new Error((res && res.error) || 'ส่งไม่สำเร็จ');
      state.receipt = res; state.screen='submitted'; clearDraft(); render();
    })
    .catch(function(err){
      if(attempt < 4){
        setTimeout(function(){ submit(attempt+1); }, 900 * Math.pow(2, attempt-1));
      } else {
        state.sendError = (err && err.message) ? err.message : 'ส่งไม่สำเร็จ';
        state.screen='failed'; render();
      }
    });
}

    + (r.duplicate ? '<p class="tiny" style="text-align:center;color:var(--amber)">ระบบเคยรับคำตอบชุดนี้ไว้แล้ว จึงไม่บันทึกซ้ำ</p>' : '')
    + '<p class="tiny" style="text-align:center">ผลนี้บันทึกไว้ให้ผู้สอนแล้ว เก็บรหัสอ้างอิงไว้เผื่อต้องติดต่อผู้สอน</p></div>';
  foot.hidden = true;
}

if (ENDPOINT.indexOf('PASTE_') === 0) {
  var strip = document.getElementById('strip');
  strip.textContent =
    'ยังไม่ได้ตั้งค่า ENDPOINT ใน index.html — ส่งคำตอบไม่ได้ (ดู SETUP.md ขั้นที่ 6)';
  strip.hidden = false;
}
render();
</script>
